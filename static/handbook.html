ion-head">Overview</h3> <p>A <a class="gloss" href="#gloss-prc"><strong>phase response curve (PRC)</strong></a> describes how the timing (phase) of a circadian rhythm shifts in response to a stimulus applied at different phases of the clock. PRCs are essential for predicting entrainment, understanding zeitgeber action, and designing clinical interventions such as timed light therapy or melatonin administration.</p> <h3 class="section-head">Types of PRCs</h3> <ul><li><strong>Type 1 (weak) resetting</strong> — small, continuous advances and delays (conventionally &lt; ~6 h), with a smooth transition between the delay and advance regions. Plotted as a <strong>phase transition curve</strong> (new phase vs. old phase) it has an average slope of 1: the new phase still depends on the old one. Produced by most zeitgebers at moderate strength.</li> <li><strong>Type 0 (strong) resetting</strong> — very large shifts (up to ~12 h) with an abrupt jump between the delay and advance regions. The phase transition curve has an average slope of 0: after the stimulus the clock arrives at essentially the <strong>same phase whatever its phase beforehand</strong>. Produced by intense stimuli (bright light in humans; certain drugs). The Type 0/Type 1 distinction is properly made on the phase transition curve, not the PRC, and the transition between them passes through a <strong>phase singularity</strong> at which the stimulus drives rhythm amplitude to zero.</li></ul> <h3 class="section-head">Constructing a PRC</h3> <p>Because there is no external light-dark cycle in constant conditions, time is measured in <strong>circadian time (CT)</strong>: the organism's own clock is divided into 24 equal hours, with CT0 defined as the start of subjective day. <strong>Subjective day</strong> is the part of the cycle the clock "thinks" is daytime (rest phase in a nocturnal animal); <strong>subjective night</strong> is the part it thinks is night (its active phase). These labels come from the animal's internal clock, not the room lights, which stay constant throughout.</p> <p>To build a PRC, many animals are each kept in constant conditions and given a brief <strong>stimulus</strong> (for example, a 15-minute light pulse, or a single melatonin dose) at a different CT. Circadian time is scaled to the animal's own free-running period, so one "circadian hour" is τ/24 real hours, and by convention <strong>CT12 is defined as activity onset in nocturnal species</strong> (CT0 as onset in diurnal species). The <a class="gloss" href="#gloss-phase-shift">phase shift (ΔΦ)</a> is then measured as the change in a clear time marker, usually <a class="gloss" href="#gloss-activity-onset">activity onset</a>, compared with where it would have fallen without the stimulus. By convention a phase advance (the rhythm shifts earlier) is positive and a delay (later) is negative. Plotting ΔΦ against the CT of stimulation, typically across 8–12 points spanning the cycle, traces out the PRC.</p> <p>One caution dominates real PRC work: the first few cycles after a stimulus show <strong>transients</strong> and are not yet at the new steady-state phase. ΔΦ must therefore be measured by fitting a regression line to the post-stimulus onsets <strong>from about cycle 4 onwards</strong> and back-extrapolating it to the day of the pulse, then comparing it with a line fitted to the pre-stimulus onsets. Reading off the very next onset (as the simplified worked example below does) will systematically misestimate the shift.</p> <p>For light PRCs the pattern is consistent: pulses in the <strong>early subjective night</strong> cause phase <strong>delays</strong>; pulses in the <strong>late subjective night</strong> and early morning cause phase <strong>advances</strong>; and during the <strong>subjective day</strong> the clock barely responds (the "dead zone"). Typical shifts are on the order of a few hours for bright light.</p> <p><strong>Worked example.</strong> An animal in constant darkness normally begins running at CT12. A bright-light pulse given at CT16 (early subjective night) delays the next onset to CT13, i.e. one hour later, so ΔΦ = &minus;1 h. The same pulse given at CT22 (late subjective night) instead advances onset to CT11, so ΔΦ = +1 h. A pulse at CT6 (mid subjective day) leaves onset essentially unchanged, ΔΦ ≈ 0.</p> <!> <!> <!>`,1);function s2(t){At(t,{id:"ch10",num:"Chapter 10",title:"Phase Response Curves",children:(e,a)=>{var r=r2(),s=je(r);Ea(s,{entries:[{year:"1958–64",text:'The first phase response curves (PRCs) are published: J. Woodland Hastings and Beatrice Sweeney report one in the dinoflagellate <em>Gonyaulax</em> (1958)<sup class="cite"><a href="#ref-25">[25]</a></sup>, and Patricia DeCoursey constructs the first PRC for a mammal (1960, the flying squirrel <em>Glaucomys volans</em>)<sup class="cite"><a href="#ref-26">[26]</a></sup>, showing the clock can be reset by light. Colin Pittendrigh develops systematic light PRCs in <em>Drosophila pseudoobscura</em> (1960–64)<sup class="cite"><a href="#ref-27">[27]</a></sup> — together establishing that a zeitgeber&rsquo;s effect depends critically on when in the cycle it is applied.'},{year:"1980s–90s",text:"Human PRCs for light (Czeisler, Kronauer) and melatonin (Lewy) are constructed using carefully controlled laboratory studies, enabling clinical applications in jet lag, shift work, and delayed sleep-wake phase disorder."},{year:"Present",text:"PRCs have been characterised for light, melatonin, exercise, temperature, and feeding across many organisms, with increasing clinical application in timed light therapy and chronobiotic treatments."}]});var n=k(s,22);fr(n,{title:"Human Clinical Relevance",children:(l,d)=>{ja();var u=Tc("Human light and melatonin PRCs have direct clinical relevance — they underpin timing protocols for jet lag recovery, shift-work adaptation, delayed sleep-wake phase disorder, and seasonal affective disorder treatment.");B(l,u)},$$slots:{default:!0}});var i=k(n,2);Tt(i,{title:"Phase Response Curves in AnCiR",tip:"For formal PRC construction and Type 0/1 classification, dedicated tools such as BioDare2, or PRC-fitting routines in R, are recommended.",children:(l,d)=>{var u=a2(),m=k(je(u),4);Et(m,{session:"sessions/demos/demo-scatter-rhythm.json",label:"Open a scatterplot example in AnCiR"}),B(l,u)},$$slots:{default:!0}});var o=k(i,2);ga(o,{chapter:"ch10"}),B(e,r)},$$slots:{default:!0}})}var n2=H("<p>Formal mixed-effects cosine models and GAMs are not currently implemented in AnCiR. However, AnCiR provides several tools for related analyses (all added from the <strong>node palette</strong>, the <strong>+</strong> button at top-right):</p> <ol><li><strong>Cosinor</strong> (Fitting family; fixed period, multiple harmonics) — approximates a GAM for the circadian component. Use 2–3 harmonics for non-sinusoidal waveforms.</li> <li><strong>Long To Wide</strong> (Transform family) feeding a Cosinor node — fits all subjects at once and produces a statistics table for further analysis in R. (To bundle several existing columns into one wire, use a <strong>Column Set</strong> or a <strong>Group</strong> rather than the palette, since Collect Columns is not on the node palette.)</li> <li><strong>Smooth Data</strong> (LOESS) — a non-parametric smooth, useful for exploring non-sinusoidal shape before fitting a parametric model.</li> <li>For full mixed-effects modelling, export your data (via a <strong>tableplot</strong> or <strong>Save session</strong>) and use R (<em>lme4</em>) or Python (<em>statsmodels</em>).</li></ol> <!>",1),i2=H(`<!> <p class="chapter-intro"><a class="gloss" href="#gloss-cosinor">Cosinor</a> analysis (Chapter 7) fits one rhythm to one recording. But real studies usually have many subjects, measured under different conditions, whose waveforms are not perfectly sinusoidal. The models in this chapter extend cosinor to answer two harder questions: <strong>how do rhythms differ between groups while accounting for individual variability?</strong> (mixed-effects models), and <strong>what if the rhythm's shape is not a simple cosine?</strong> (additive models).</p> <h3 class="section-head">Mixed-Effects Cosine Models</h3> <p>When you record several subjects, each has its own baseline level and rhythm, and you typically want a group-level conclusion (e.g. "does the drug shift acrophase?") without being fooled by one unusual individual. A linear <a class="gloss" href="#gloss-lmem">mixed-effects model</a> handles exactly this by fitting cosine predictors together with two kinds of effect:</p> <!> <p><strong>Fixed effects</strong> are the population-level quantities you care about: the cosine terms that define the average rhythm, plus predictors such as group membership (treatment vs. control) and <strong>continuous covariates</strong> (measured numbers like age or BMI). <strong>Random effects</strong>, written <code>(1|subject)</code>, allow each subject its own baseline: this "random intercept" absorbs the fact that some individuals are simply more active than others, so that between-subject scatter is not mistaken for a treatment effect. Use a mixed-effects model whenever you have repeated measures from multiple subjects and want group-level inference. Implemented in R via <em>lme4</em>; in Python via <em>statsmodels</em>.</p> <p>A <strong>random intercept alone</strong> lets subjects differ in <a class="gloss" href="#gloss-mesor">MESOR</a> but constrains them to share the same amplitude and acrophase — often the very variation the study exists to measure. To allow subject-specific rhythms, put random slopes on the cosine terms too: <code>(1 + cos + sin | subject)</code>. Note also that dense within-subject time series have strongly <a class="gloss" href="#gloss-autocorrelation">autocorrelated</a> residuals, violating the model's conditional-independence assumption and producing over-confident p-values; fit an AR(1) residual correlation structure (available in <em>nlme</em> via <code>corAR1</code>, but not in <em>lme4</em>) or bin coarsely enough to decorrelate.</p> <h3 class="section-head">Generalised Additive Models (GAMs)</h3> <p>A cosine assumes the rhythm is a smooth, symmetric wave. Many biological rhythms are not: hormone profiles have sharp peaks, and activity records have long flat rest bouts and steep on/off transitions. <a class="gloss" href="#gloss-gam">GAMs</a> relax that assumption by replacing the fixed cosine with a <strong>smooth function</strong> &mdash; a flexible wiggly curve whose shape is learned from the data rather than imposed in advance:</p> <!> <p>For a daily rhythm the smoother must connect back on itself at the 24-hour boundary (the value and slope at hour 24 must match hour 0), so a <strong>cyclic cubic <a class="gloss" href="#gloss-spline">spline</a></strong> is used: a smooth curve, built from polynomial pieces, that wraps seamlessly around the day. GAMs are the right tool when the waveform clearly departs from a cosine and you care about its true shape; the price is that they estimate a curve rather than a few interpretable parameters like amplitude and acrophase. Implemented in R via <em>mgcv</em>.</p> <!> <!>`,1);function o2(t){const e=String.raw`y(t) = \beta_0 + \beta_1\cos\!\left(\frac{2\pi t}{\tau}\right) + \beta_2\sin\!\left(\frac{2\pi t}{\tau}\right) + \text{group}[\cdots] + (1|\text{subject}) + \varepsilon`,a=String.raw`y(t) = f(t \bmod 24) + \text{covariates} + \varepsilon`;At(t,{id:"ch11",num:"Chapter 11",title:"General Linear and Additive Models",children:(r,s)=>{var n=i2(),i=je(n);Ea(i,{entries:[{year:"1990s",text:"Linear mixed-effects models (LMEMs) provide a natural framework for multi-subject chronobiological studies. R packages nlme and later lme4 make these methods accessible."},{year:"2000s–present",text:"Generalised Additive Models (GAMs) with cyclic smooths are applied to circadian data to handle non-sinusoidal waveforms. LASSO and ridge regression enable high-dimensional circadian omics analysis."}]});var o=k(i,8);Ot(o,{get tex(){return e}});var l=k(o,10);Ot(l,{get tex(){return a}});var d=k(l,4);Tt(d,{title:"Linear/Additive Models in AnCiR",tip:"",children:(m,g)=>{var f=n2(),y=k(je(f),4);Et(y,{session:"sessions/demos/demo-tp-cosinor.json",label:"Open the Cosinor example in AnCiR"}),B(m,f)},$$slots:{default:!0}});var u=k(d,2);ga(u,{chapter:"ch11"}),B(r,n)},$$slots:{default:!0}})}var l2=H("<p>AnCiR has a dedicated circular-statistics stack. Add these nodes from the <strong>node palette</strong> (the <strong>+</strong> button, top-right):</p> <ol><li>Fit a <strong>Cosinor</strong> node (Fitting family) per group to obtain each subject's <strong>acrophase</strong>; the acrophase output port carries one value per subject.</li> <li>Wire those acrophase columns into the <strong>Rayleigh test</strong> node (Analysis family). Set <strong>unit</strong> to hours and the <strong>period</strong> to 24 h. It reports the mean resultant length <strong>R</strong>, <strong>z</strong>, and the Rayleigh <strong>p-value</strong> per column (is there a preferred phase at all?), and — with <strong>Watson-Williams</strong> enabled — an <strong>F</strong> and p-value for whether the groups share the same mean phase.</li> <li>For a visual summary, wire the same acrophase columns into the <strong>Circular phase plot</strong> (Plots family): each group appears as a coloured cluster on a 24-hour clock with its mean-resultant vector, with optional rose wedges and the Watson-Williams test overlaid.</li></ol> <!>",1),c2=H(`<!> <p class="chapter-intro">Phase angles — <a class="gloss" href="#gloss-acrophase">acrophases</a>, activity onset times, peak cortisol times — are <strong>circular variables</strong> that wrap around at 360° or 24 hours. Standard linear statistics (mean, SD, <a class="gloss" href="#gloss-t-test">t-test</a>) are inappropriate and give misleading results for circular data. <a class="gloss" href="#gloss-circular-statistics">Circular statistics</a> provide the correct framework.</p> <h3 class="section-head">Descriptive Circular Statistics</h3> <p>First convert each clock time t<sub>i</sub> (hours) to an angle: <strong>θ<sub>i</sub> = 2π t<sub>i</sub> / 24</strong> radians (or 360° t<sub>i</sub>/24), measuring from 00:00 as 0°. If the rhythm's period is not 24 h, divide by τ instead. The trick is then to treat each phase as an arrow of length 1 pointing in its direction on the clock face, and average the arrows rather than the numbers. In the formula below, C̄ and S̄ are the average of the cosines and of the sines of all the phase angles &mdash; together they are the x and y coordinates of the average arrow. Its direction, recovered with <code>arctan2</code> (the two-argument arctangent, which keeps track of the correct quadrant), is the <strong>mean phase</strong> θ̄; its length R is the <strong>mean resultant length</strong>.</p> <!> <p>R measures how tightly the phases cluster: R = 1 means every phase is identical (arrows all point the same way and reinforce), while R = 0 means they are spread evenly around the clock (arrows cancel out). <strong>Circular variance</strong> = 1 − R is the mirror image: 0 for perfectly clustered, 1 for perfectly scattered.</p> <p><strong>Worked example.</strong> Five subjects have peak (acrophase) times of 23:30, 00:15, 23:45, 00:30 and 00:00. A naïve arithmetic mean of the clock numbers (23.5, 0.25, 23.75, 0.5, 0) gives ≈ 9.6 h &mdash; the middle of the afternoon, badly wrong, because it does not know 23:59 is next to 00:00. Averaging them as arrows instead gives a circular mean of about 00:00 with a large R (≈ 0.99), correctly capturing that all five peak around midnight.</p> <h3 class="section-head">Tests for Circular Data</h3> <p>Which test you need depends on the question you are asking:</p> <ul><li><a class="gloss" href="#gloss-rayleigh"><strong>Rayleigh test</strong></a> &mdash; <em>Is there a preferred phase at all?</em> The null hypothesis is that the phases are spread uniformly around the clock; a significant result (large R for the sample size n) means the group clusters at some time. Use it for a single group, e.g. "do these animals reliably peak at a particular time?"</li> <li><a class="gloss" href="#gloss-watson-williams"><strong>Watson-Williams test</strong></a> &mdash; <em>Do two groups peak at different times?</em> The circular analogue of the two-sample <a class="gloss" href="#gloss-t-test">t-test</a>; its null hypothesis is that both groups share the same mean phase. Use it to compare, say, treatment vs. control acrophases. It assumes both samples are von Mises distributed with a <strong>common concentration κ</strong> (the circular analogue of equal variances) and are reasonably clustered — <strong>R̄ ≳ 0.7 in each group</strong>. Unequal concentration is the commonest violation, since treated groups are often more dispersed than controls; check R̄ in both groups first, and fall back to Watson's U² if they differ.</li> <li><strong>Watson U² test</strong> &mdash; <em>Do two groups differ in any way</em> (mean phase or spread)? A non-parametric test of whether two samples come from the same circular distribution. Prefer it to Watson-Williams when the data are scattered or clearly non-symmetric, where the Watson-Williams assumptions fail.</li></ul> <!> <!>`,1);function d2(t){const e=String.raw`\bar{C} = \tfrac{1}{n}\sum_i \cos\theta_i,\quad \bar{S} = \tfrac{1}{n}\sum_i \sin\theta_i,\quad \bar{\theta} = \operatorname{arctan2}(\bar{S},\bar{C}),\quad R = \sqrt{\bar{C}^2+\bar{S}^2}`;At(t,{id:"ch12",num:"Chapter 12",title:"Circular Statistics",children:(a,r)=>{var s=c2(),n=je(s);Ea(n,{entries:[{year:"1953",text:'R.A. Fisher publishes foundational work on the statistics of directional data ("Dispersion on a sphere").<sup class="cite"><a href="#ref-30">[30]</a></sup>'},{year:"1993–2000",text:`The modern reference texts appear: N.I. Fisher's <em>Statistical Analysis of Circular Data</em> (1993)<sup class="cite"><a href="#ref-13">[13]</a></sup> and Mardia &amp; Jupp's <em>Directional Statistics</em> (2000)<sup class="cite"><a href="#ref-12">[12]</a></sup>, both still standard.`},{year:"1990s–present",text:"Circular statistics are increasingly applied in chronobiology for acrophase distributions, activity onset times, and sleep timing data. R packages <em>circular</em> and <em>CircStats</em> implement these methods."}]});var i=k(n,8);Ot(i,{get tex(){return e}});var o=k(i,12);Tt(o,{title:"Circular Statistics in AnCiR",tip:"Never use a standard unpaired t-test to compare acrophase times between groups — use the Watson-Williams test (the circular analogue of the t-test). A 23:00 acrophase and a 01:00 acrophase are only 2 hours apart circularly, but would appear 22 hours apart to a linear test.",children:(d,u)=>{var m=l2(),g=k(je(m),4);Et(g,{session:"sessions/demos/demo-workflow-phase-groups.json",label:"Open the phase-groups example in AnCiR"}),B(d,m)},$$slots:{default:!0}});var l=k(o,2);ga(l,{chapter:"ch12"}),B(a,s)},$$slots:{default:!0}})}var h2=H("<ol><li><strong>Import</strong> your data (time column + activity counts column) via <strong>Sources → Import file</strong>.</li> <li><strong>Inspect visually:</strong> add a <strong>scatterplot</strong> of the raw data and a first <strong>actogram</strong> (Plots) to check data quality.</li> <li><strong>Remove outliers</strong> (Filtering → Remove Outliers) if there are implausible spikes.</li> <li><strong>Handle the resulting gaps.</strong> Outlier removal leaves holes, and the χ² periodogram and FFT need a complete, evenly spaced series. Interpolate short gaps (Binning → Interpolate) or switch to Lomb-Scargle, and <strong>record the fraction of data removed and interpolated</strong>.</li> <li><strong>Detrend</strong> (Filtering → Remove Trend, linear) if there is a slow baseline drift.</li> <li><strong>Bin</strong> if needed (Binning → Bin Data, e.g., 15-minute bins, mean) to reduce noise and regularise sampling.</li> <li><strong>Actogram:</strong> build the main actogram with double-plotting and light-dark shading.</li> <li><strong>Periodogram:</strong> run a Chi-squared periodogram to confirm the dominant period and estimate τ.</li> <li><strong>Cosinor:</strong> apply Cosinor (Fitting; fixed period = τ from step 7, or 24 h) to extract MESOR, amplitude, and acrophase with 95% confidence intervals.</li> <li><strong>Store</strong> key results (period, amplitude, acrophase) with <strong>Store Value</strong> for reporting.</li></ol> <!>",1),u2=H('<ul><li><strong>Analysing raw, unpreprocessed data</strong> — always inspect and preprocess before formal analysis.</li> <li><strong>Assuming τ = exactly 24 h</strong> — always estimate τ from the periodogram; even a 0.5 h error matters for cosinor acrophase estimates.</li> <li><strong>χ² periodogram on sparse or irregular data</strong> — use Lomb-Scargle instead.</li> <li><strong>Linear statistics on circular phase data</strong> — use <a class="gloss" href="#gloss-circular-statistics">circular statistics</a> for acrophase comparisons between groups.</li> <li><strong>Insufficient recording duration</strong> — at minimum 5–7 complete cycles are needed for reliable period estimation.</li> <li><strong>Chi-squared harmonics in square-wave data</strong> — may produce a spurious 12 h peak. Confirm with Lomb-Scargle.</li> <li><strong>Time-unspecified group comparisons</strong> — comparing groups at uncontrolled times without accounting for circadian variation can reverse effect directions (Refinetti et al. 2007, Fig. 26).</li> <li><strong>Ignoring masking</strong> — acute environmental effects can temporarily obscure the underlying rhythm.</li></ul>'),m2=H('For group comparisons of acrophase, polar plots provide an intuitive summary (amplitude = vector length, acrophase = vector angle). The 95% confidence ellipse shows joint uncertainty. For population-mean cosinor, individual vectors are plotted with the group mean vector and confidence region (Refinetti et al. 2007 <sup class="cite"><a href="#ref-1">[1]</a></sup>, Fig. 22).',1),p2=H('<h3 class="section-head">Choosing the Right Method</h3> <!> <p>A few rules of thumb turn this table into decisions. On <strong>sampling density</strong>: with fewer than roughly 6 samples per 24 h, or clearly irregular timestamps, use Lomb-Scargle; with dense, evenly-spaced data the χ² periodogram is faster and equally valid. On <strong>fixed vs. free period</strong>: use fixed-period cosinor when you already know τ (from the periodogram, or because the animal is entrained to a 24 h cycle), and free-parameter mode only when the period is genuinely unknown. Reach for <strong>NPCRA</strong> or a <strong>GAM</strong> whenever the waveform is visibly non-sinusoidal, since cosinor will then underestimate the amplitude. And always start with an <strong>actogram</strong>: look before you quantify.</p> <h3 class="section-head">Recommended Analysis Workflow for Actigraphy Data</h3> <!> <h3 class="section-head">Common Pitfalls</h3> <!> <h3 class="section-head">Reporting Standards</h3> <p>When reporting chronobiological analyses, include:</p> <ul><li>Data type, recording duration, and sampling resolution.</li> <li>Preprocessing steps (outlier removal, binning, smoothing) with parameters, and the <strong>proportion of data removed or interpolated</strong>.</li> <li>Analysis method and software, including version and citation.</li> <li>Estimated period τ with 95% confidence interval.</li> <li>Cosinor parameters (MESOR, amplitude, acrophase) with 95% CIs, if applicable.</li> <li>Sample size; whether values represent group means or individual estimates.</li> <li>Statistical tests for group comparisons, with effect sizes and p-values.</li></ul> <p>Report parameters as an estimate with its uncertainty, not a bare number. A complete statement might read:</p> <blockquote class="report-example svelte-1cvefix">"Locomotor activity was recorded for 10 days at 1-minute resolution, binned to 15 minutes (mean; 0.3% of bins interpolated across short gaps). After linear detrending, a χ² periodogram (0.05 h period step, 60 bins) identified a dominant period of τ = 23.8 h (Q_P = 412, p &lt; 0.001). A 95% CI for τ of 23.7–23.9 h was obtained by linear regression of daily activity onsets on cycle number. Fixed-period cosinor (τ = 23.8 h) estimated MESOR = 102 ± 6, amplitude = 24 ± 5, and acrophase at 14:20 ± 40 min (referenced to day 1; all 95% CI; n = 12). Acrophase differed between treatment and control (Watson-Williams F(1, 22) = 6.1, p = 0.02). Analysed in AnCiR (v β6)."</blockquote> <p>A <a class="gloss" href="#gloss-p-value">p-value</a> alone is not enough: always pair it with the effect size (here, the actual difference in acrophase and amplitude) so readers can judge biological, not just statistical, significance.</p> <!> <!>',1);function f2(t){At(t,{id:"ch13",num:"Chapter 13",title:"Best Practices and Reporting",children:(e,a)=>{var r=p2(),s=k(je(r),2);m0(s,{headers:["Method","Best suited for"],rows:[["Actogram","Visual inspection, quality control, detecting phase shifts and free-running rhythms"],["χ² Periodogram","Period detection in dense, equally-spaced activity/locomotor data"],["Lomb-Scargle","Period detection in sparse, irregularly-spaced or clinical data"],["Cosinor (fixed-period)","Parameter estimation (amplitude, phase, MESOR) with CIs; group comparison"],["Cosinor (free-parameter)","Exploratory period estimation when τ is not known in advance"],["Mixed-effects cosinor","Multi-subject clinical studies with covariates"],["GAM (cyclic spline)","Non-sinusoidal waveforms; exploratory analysis"],["NPCRA (IS, IV)","Actigraphy in clinical populations; rhythm fragmentation assessment"],["Circular statistics","Comparing phase angles between groups"]]});var n=k(s,6);Tt(n,{title:"Standard Actigraphy Pipeline in AnCiR",tip:"On the canvas this whole pipeline is one connected chain of nodes — each step reads from the previous node's output port, so you can change a parameter early on and watch every downstream plot update.",children:(d,u)=>{var m=h2(),g=k(je(m),2);Et(g,{session:"sessions/classroom/learn-hidden-rhythm.json",label:"Open a worked example session in AnCiR"}),B(d,m)},$$slots:{default:!0}});var i=k(n,4);Br(i,{title:"Common Mistakes to Avoid",children:(d,u)=>{var m=u2();B(d,m)},$$slots:{default:!0}});var o=k(i,14);fr(o,{title:"Reporting Acrophase",children:(d,u)=>{ja();var m=m2();ja(2),B(d,m)},$$slots:{default:!0}});var l=k(o,2);ga(l,{chapter:"ch13"}),B(e,r)},$$slots:{default:!0}})}var g2=H(`<table class="glossary-table"><tbody><tr id="gloss-acrophase"><td>Acrophase</td><td>The clock time at which a rhythm reaches its peak (e.g., the warmest point of the day, or when activity is highest).</td></tr><tr id="gloss-activity-onset"><td>Activity onset</td><td>The time an animal starts its daily active phase. A clear, easily-marked reference point used to track the clock's phase, especially in actograms and phase response curves (Chapters 5, 10).</td></tr><tr id="gloss-amplitude"><td>Amplitude</td><td>How "tall" a rhythm is: half the distance from the lowest point to the highest. (Some authors use the full height instead — be aware of this ambiguity.)</td></tr><tr id="gloss-autocorrelation"><td>Autocorrelation</td><td>A measure of how similar a signal is to a time-shifted copy of itself. Strong repeating patterns show up as peaks at lags equal to the period.</td></tr><tr id="gloss-chi-squared-periodogram"><td>Chi-squared (χ²) periodogram</td><td>A way to test for a repeating pattern. Tries many candidate periods and asks: does the data line up neatly when folded at this period? Best for densely-sampled activity records (Chapter 6).</td></tr><tr id="gloss-circadian-rhythm"><td>Circadian rhythm</td><td>A body rhythm with a period close to 24 hours, driven by an internal clock.</td></tr><tr id="gloss-circular-statistics"><td>Circular statistics</td><td>Maths for data that wrap around a circle, such as clock times where 23:59 sits right next to 00:00. Ordinary averages and tests go wrong near midnight; circular versions fix this (Chapter 12).</td></tr><tr id="gloss-r-squared"><td>Coefficient of determination (R²)</td><td>How much of the variation in the data a model explains. Runs from 0 (nothing explained) to 1 (perfect fit).</td></tr><tr id="gloss-confidence-interval"><td>Confidence interval (CI)</td><td>A range of plausible values for a measurement. A 95% CI means: if you repeated the experiment many times, 95% of such intervals would contain the true value.</td></tr><tr id="gloss-correlogram"><td>Correlogram</td><td>A plot showing how similar a signal is to itself at different time shifts. Peaks at 24 h, 48 h, and so on point to a daily rhythm (Chapter 9).</td></tr><tr id="gloss-cosinor"><td>Cosinor</td><td>A method that fits a cosine wave to your data to pull out the average level (MESOR), the size of the rhythm (amplitude), and the time of its peak (acrophase) (Chapter 7).</td></tr><tr id="gloss-degrees-of-freedom"><td>Degrees of freedom (df)</td><td>Roughly, how much information is left in your data after you've estimated things from it. It tells you which reference table to use when judging how unusual a result is.</td></tr><tr id="gloss-detrending"><td>Detrending</td><td>Subtracting a slow drift from the data (for example, sensor drift or the animal gaining weight) so the rhythm is easier to see (Chapter 4).</td></tr><tr id="gloss-dft"><td>Discrete Fourier Transform (DFT)</td><td>A maths tool that breaks a recorded signal into a set of pure waves at different speeds (frequencies) (Chapter 8).</td></tr><tr id="gloss-duty-cycle"><td>Duty cycle</td><td>For an on/off (square-wave) signal, the fraction of each cycle spent in the "on" state.</td></tr><tr id="gloss-enright-periodogram"><td>Enright periodogram</td><td>A period-finding method based on the variance of period-folded data: for each candidate period it folds the series into a table (cycles as rows) and measures how much the column means scatter. The direct ancestor of the chi-squared periodogram (Chapter 6).</td></tr><tr id="gloss-entrainment"><td>Entrainment</td><td>When a biological rhythm locks on to a daily cue from the environment (most often the light/dark cycle).</td></tr><tr id="gloss-f-test"><td>F-test</td><td>A test that compares two sources of variation. In cosinor, it asks: is the rhythm I fitted big enough to be real, or could it just be noise?</td></tr><tr id="gloss-fft"><td>Fast Fourier Transform (FFT)</td><td>A fast computer algorithm for doing a Fourier Transform. Needs evenly-spaced samples to work (Chapter 8).</td></tr><tr id="gloss-fourier"><td>Fourier analysis</td><td>The idea that essentially any well-behaved repeating signal can be written as a sum of simple waves at different speeds. The basis of most frequency-based methods (Chapter 8).</td></tr><tr id="gloss-free-running-period"><td>Free-running period (τ)</td><td>The natural period of the body clock when there are no external time cues (constant lighting, no clocks).</td></tr><tr id="gloss-gam"><td>Generalised Additive Model (GAM)</td><td>A flexible kind of regression that replaces straight lines with smooth curves — useful when a rhythm is not a clean cosine shape (Chapter 11).</td></tr><tr id="gloss-harmonic"><td>Harmonic</td><td>A multiple of a rhythm's main frequency (e.g., a 12-hour bump on top of a 24-hour rhythm). Adding harmonics lets a cosine fit describe non-sinusoidal shapes.</td></tr><tr id="gloss-infradian"><td>Infradian rhythm</td><td>A body rhythm with a period longer than 24 hours (e.g., menstrual cycle, seasonal rhythm).</td></tr><tr id="gloss-interpolation"><td>Interpolation</td><td>Estimating missing values from the points around them, so a broken series becomes complete and evenly spaced. Linear draws a straight line across the gap; a spline threads a smooth curve (Chapter 4).</td></tr><tr id="gloss-is"><td>IS (Interdaily Stability)</td><td>How regular the daily pattern is across several days. 0 means no regularity, 1 means every day is identical.</td></tr><tr id="gloss-iv"><td>IV (Intradaily Variability)</td><td>How choppy the rhythm is within a single day. 0 is perfectly smooth; the theoretical maximum is 4, and IV ≈ 2 is the value expected from random noise, so values near or above 2 mean a highly fragmented record. Strongly dependent on the epoch length.</td></tr><tr id="gloss-lasso"><td>LASSO / Ridge regression</td><td>Regression methods that add a penalty to keep the model from over-fitting when there are a lot of possible predictors (common in circadian gene-expression studies) (Chapter 11).</td></tr><tr id="gloss-loess"><td>LOESS</td><td>A smoothing method that fits a little curve through each local slice of the data. Handles uneven sampling well (Chapter 4).</td></tr><tr id="gloss-lomb-scargle"><td>Lomb-Scargle periodogram</td><td>A period-finding method that works on data with gaps or irregular timestamps — no need to fill in missing values first (Chapter 6).</td></tr><tr id="gloss-mesor"><td>MESOR</td><td>The average level of a fitted cosine curve. A "rhythm-adjusted mean" that isn't thrown off by uneven sampling across the day.</td></tr><tr id="gloss-missing-data"><td>Missing data</td><td>Gaps in a recording (dropped sensors, removed outliers, lost samples). Many methods assume an unbroken, evenly spaced series, so gaps must be handled by a gap-tolerant method or filled by interpolation (Chapter 4).</td></tr><tr id="gloss-lmem"><td>Mixed-effects model (LMEM)</td><td>A regression that handles repeated measures from several subjects at once. One set of effects describes the typical person; another captures how each person differs (Chapter 11).</td></tr><tr id="gloss-npcra"><td>NPCRA</td><td>Non-parametric circadian rhythm analysis. A group of simple summary metrics (IS, IV, L5, M10, RA) most commonly used for activity-watch data (Chapter 9).</td></tr><tr id="gloss-null-hypothesis"><td>Null hypothesis (H₀)</td><td>The "nothing is happening" starting assumption (e.g., no rhythm, no difference between groups). Rejected when your data would be very unlikely if it were true.</td></tr><tr id="gloss-nyquist"><td>Nyquist-Shannon theorem</td><td>You can't reliably detect a rhythm faster than half your sampling rate. To characterise a 24-hour rhythm, sample <em>well inside</em> every 12 hours (1–3 hourly in practice); faster components alias into lower frequencies if you sample too slowly (Chapter 2).</td></tr><tr id="gloss-p-value"><td>p-value</td><td>The chance of seeing a result at least as striking as yours if the null hypothesis (no effect) were true. Smaller values mean stronger evidence that something is really going on.</td></tr><tr id="gloss-period"><td>Period (τ)</td><td>The length of one full cycle of a rhythm (usually in hours).</td></tr><tr id="gloss-periodogram"><td>Periodogram</td><td>A chart that shows the strength of a rhythm at each candidate period. The tallest peak is your best estimate of the period.</td></tr><tr id="gloss-phase"><td>Phase</td><td>Where the rhythm is in its cycle at a given moment (often reported as the time of the peak).</td></tr><tr id="gloss-phase-shift"><td>Phase shift (ΔΦ)</td><td>A change in the timing of a rhythm caused by a stimulus (e.g., a pulse of light, a dose of melatonin).</td></tr><tr id="gloss-population-cosinor"><td>Population-mean cosinor</td><td>Cosinor applied across several subjects at once to get group-level rhythm parameters. Averages each person's sine/cosine components as vectors and tests with a modified F-test.</td></tr><tr id="gloss-power-spectrum"><td>Power spectrum</td><td>A plot of how much "energy" a signal carries at each frequency. Peaks mark periodic components (Chapter 8).</td></tr><tr id="gloss-prc"><td>PRC</td><td>Phase Response Curve. Shows how much a stimulus shifts the clock depending on when in the cycle it is given.</td></tr><tr id="gloss-rayleigh"><td>Rayleigh test</td><td>A circular-statistics test for whether a set of phases (clock times) cluster around a particular time or are spread evenly round the clock (Chapter 12).</td></tr><tr id="gloss-residual"><td>Residual</td><td>The leftover: what the data look like after you subtract the model's fit. Small, random-looking residuals = good fit.</td></tr><tr id="gloss-rmse"><td>RMSE</td><td>Root Mean Squared Error. A simple number for how far, on average, the model's predictions sit from the actual data.</td></tr><tr id="gloss-savitzky-golay"><td>Savitzky-Golay filter</td><td>A smoothing method that fits a small polynomial inside a sliding window. Keeps sharp peaks intact better than a plain moving average (Chapter 4).</td></tr><tr id="gloss-scn"><td>SCN</td><td>Suprachiasmatic nucleus. The master body clock in mammals, sitting in the base of the brain just above the optic chiasm.</td></tr><tr id="gloss-smoothing"><td>Smoothing</td><td>Gently averaging away short-term jitter so the underlying rhythm is easier to see (Chapter 4).</td></tr><tr id="gloss-spectral-leakage"><td>Spectral leakage</td><td>A quirk of Fourier analysis: power from one frequency "bleeds" into the frequencies next to it. Reduced by tapering the signal with a window function (Chapter 8).</td></tr><tr id="gloss-spline"><td>Spline</td><td>A smooth curve built from low-degree polynomial pieces joined so the result has no kinks. Cubic splines are a common way to interpolate smoothly across short gaps (Chapter 4).</td></tr><tr id="gloss-t-test"><td>t-test</td><td>A standard test for whether two groups have different averages. Not safe for clock times — use the Watson-Williams test for phases instead.</td></tr><tr id="gloss-ultradian"><td>Ultradian rhythm</td><td>A body rhythm with a period shorter than 24 hours (e.g., REM sleep cycles of about 90 minutes).</td></tr><tr id="gloss-variance"><td>Variance</td><td>A measure of how spread out the data are around the mean. Many methods (F-test, R², IS, IV) are built on variance.</td></tr><tr id="gloss-watson-williams"><td>Watson-Williams test</td><td>The circular-statistics equivalent of a t-test: compares the average timing of peaks between two groups, without getting confused by the midnight wrap-around (Chapter 12).</td></tr><tr id="gloss-whittaker-eilers"><td>Whittaker-Eilers smoother</td><td>A smoother that balances "stay close to the data" against "keep the curve smooth". Handles gaps in the data well (Chapter 4).</td></tr><tr id="gloss-window-function"><td>Window function</td><td>A shaped envelope (Hann, Hamming, Blackman) that tapers a signal to zero at its ends before Fourier analysis, to reduce spectral leakage (Chapter 8).</td></tr><tr id="gloss-zeitgeber"><td>Zeitgeber (ZT)</td><td>An environmental time cue (German for "time-giver") that synchronises the body clock. ZT0 is usually defined as lights-on.</td></tr><tr id="gloss-zero-padding"><td>Zero-padding</td><td>Sticking zeros on the end of a time series before running an FFT. Doesn't add new information, but spaces the results more finely along the frequency axis (Chapter 8).</td></tr></tbody></table>`);function v2(t){At(t,{id:"glossary",num:"Appendix A",title:"Glossary",children:(e,a)=>{var r=g2();B(e,r)},$$slots:{default:!0}})}var y2=H("<p>A range of tools are available for chronobiological analysis:</p> <!>",1);function w2(t){At(t,{id:"software",num:"Appendix B",title:"Software Landscape",children:(e,a)=>{var r=y2(),s=k(je(r),2);Mn(s,{headers:["Tool","Platform","Notes"],rows:[["AnCiR","Web browser (no install)","Free, open-source (Apache-2.0). Actograms, periodograms (χ²/Lomb-Scargle/Enright), cosinor, correlogram, FFT, non-parametric rest-activity metrics, circular statistics (Rayleigh, Watson-Williams), and preprocessing. Does not yet cover PRC construction or mixed-effects/GAM modelling."],["ActogramJ","ImageJ plug-in","Free, open-source. Requires Java/ImageJ. Strong actogram tools."],["RhythmicAlly","R/Shiny (web)","Free, open-source. Requires R knowledge."],["BioDare2","Web browser","Free for academic use. Strong period analysis tools."],["zeitgebr / circatools","R packages","Fr ","cardinality":"many"}],"params":[],"outputs":[],"demo":"sessions/demos/demo-workflow-stats-eda.json"},{"id":"meansem","displayName":"Mean ± SEM","kind":"plot","family":"Plots","description":"Mean ± SEM overlay: per-group mean marker with standard-error whiskers.","hideFromPalette":false,"inputs":[{"name":"x","kind":"column","cardinality":"many"},{"name":"y","kind":"column","cardinality":"many"}],"params":[],"outputs":[],"demo":"sessions/demos/demo-workflow-stats-anova.json"},{"id":"pairsplot","displayName":"Pairs plot","kind":"plot","family":"Plots","description":"Scatterplot matrix (pairs.panels): histograms on the diagonal, scatter + fit above, correlation below.","hideFromPalette":false,"inputs":[{"name":"column","kind":"column","cardinality":"many"}],"params":[],"outputs":[],"demo":"sessions/demos/demo-workflow-stats-correlation.json"},{"id":"periodogram","displayName":"Periodogram","kind":"plot","family":"Plots","description":"Periodogram (Lomb-Scargle / chi-squared) of a time-series.","hideFromPalette":false,"inputs":[{"name":"time","kind":"column","cardinality":"many"},{"name":"values","kind":"column","cardinality":"many"}],"params":[],"outputs":[],"demo":"sessions/demos/demo-workflow-free-running.json"},{"id":"scatterplot","displayName":"Scatterplot","kind":"plot","family":"Plots","description":"Scatterplot of one column versus another.","hideFromPalette":false,"inputs":[{"name":"x","kind":"column","cardinality":"many"},{"name":"y","kind":"column","cardinality":"many"}],"params":[],"outputs":[],"demo":"sessions/demos/demo-workflow-stats-regression.json"},{"id":"tableplot","displayName":"Table","kind":"plot","family":"Plots","description":"Tabular display of a table or its summary statistics.","hideFromPalette":false,"inputs":[],"params":[],"outputs":[],"demo":"sessions/demos/demo-table-columns.json"},{"id":"Add","displayName":"Add","kind":"process","family":"Arithmetic","description":"Add a constant or column to the input column.","hideFromPalette":false,"
