","description":"Measure the endogenous period (tau) of a rhythm running without a zeitgeber. A double-plotted actogram shows the rhythm drifting against the 24 h grid, a Lomb-Scargle periodogram estimates tau, and the Rhythmicity Analysis node reports the peak period as a wireable number. Includes the literature caveat to avoid the chi-square periodogram.","summary":"Measure the endogenous period (tau) of a rhythm with no zeitgeber.","group":"Rhythm & circadian","url":"sessions/demos/demo-workflow-free-running.json","kind":"workflow","showcases":["RhythmicityAnalysis","actogram","periodogram"],"keywords":"workflow — free-running period measure the endogenous period (tau) of a rhythm running without a zeitgeber. a double-plotted actogram shows the rhythm drifting against the 24 h grid, a lomb-scargle periodogram estimates tau, and the rhythmicity analysis node reports the peak period as a wireable number. includes the literature caveat to avoid the chi-square periodogram. workflows rhythmicityanalysis actogram periodogram"},{"id":"workflow-phase-groups","name":"Workflow — group phase comparison","family":"Workflows","description":"Do two groups peak at different times of day? Per-subject phase is extracted by Cosinor (its acrophase port emits one peak time per subject, i.e. the group’s phase distribution), shown on a 24 h circular plot with each group’s Rayleigh vector, and tested with Rayleigh (is each group clustered?) plus Watson-Williams (do the groups differ in mean phase?).","summary":"Test whether two groups peak at different times of day.","group":"Rhythm & circadian","url":"sessions/demos/demo-workflow-phase-groups.json","kind":"workflow","showcases":["Cosinor","RayleighTest","circularphase"],"keywords":"workflow — group phase comparison do two groups peak at different times of day? per-subject phase is extracted by cosinor (its acrophase port emits one peak time per subject, i.e. the group’s phase distribution), shown on a 24 h circular plot with each group’s rayleigh vector, and tested with rayleigh (is each group clustered?) plus watson-williams (do the groups differ in mean phase?). workflows cosinor rayleightest circularphase"},{"id":"workflow-stats-eda","name":"Workflow — exploratory data analysis (first look)","family":"Workflows","description":"The universal first pass over a new dataset. Describe Data reports centre / spread / skew, a normality test screens each variable, and a correlation matrix maps the relationships — visualised as faceted histograms, a correlation heatmap and a pairs plot. Read the distributions and the relationship map BEFORE running any inferential test.","summary":"Get to know a new dataset before running any test.","group":"General statistics","url":"sessions/demos/demo-workflow-stats-eda.json","kind":"workflow","showcases":["DescribeData","NormalityTest","Correlation","histogram"],"keywords":"workflow — exploratory data analysis (first look) the universal first pass over a new dataset. describe data reports centre / spread / skew, a normality test screens each variable, and a correlation matrix maps the relationships — visualised as faceted histograms, a correlation heatmap and a pairs plot. read the distributions and the relationship map before running any inferential test. workflows describedata normalitytest correlation histogram"},{"id":"workflow-stats-two-group","name":"Workflow — compare two groups","family":"Workflows","description":"The classic two-group question: is the treatment different from control? Compare groups auto-selects the test (Welch t when both groups look normal, Mann-Whitney when they do not) and surfaces the assumption check, and a boxplot with a significance bar shows the difference. Read: which test fired and why, the p-value, and the direction/size of the shift.","summary":"Is group A different from group B?","group":"General statistics","url":"sessions/demos/demo-workflow-stats-two-group.json","kind":"workflow","showcases":["GroupComparison","boxplot"],"keywords":"workflow — compare two groups the classic two-group question: is the treatment different from control? compare groups auto-selects the test (welch t when both groups look normal, mann-whitney when they do not) and surfaces the assumption check, and a boxplot with a significance bar shows the difference. read: which test fired and why, the p-value, and the direction/size of the shift. workflows groupcomparison boxplot"},{"id":"workflow-stats-anova","name":"Workflow — compare several groups (ANOVA)","family":"Workflows","description":"Three or more conditions: do they differ, and which pairs? Compare groups auto-runs a one-way ANOVA (or Kruskal-Wallis if non-normal) with Tukey/Holm post-hoc, a mean ± SEM plot shows the group means, and a boxplot with significance bars shows the pairwise differences. Read the omnibus test FIRST; only interpret the pairwise grid if it is significant.","summary":"Do three or more groups differ, and which pairs?","group":"General statistics","url":"sessions/demos/demo-workflow-stats-anova.json","kind":"workflow","showcases":["GroupComparison","meansem","boxplot"],"keywords":"workflow — compare several groups (anova) three or more conditions: do they differ, and which pairs? compare groups auto-runs a one-way anova (or kruskal-wallis if non-normal) with tukey/holm post-hoc, a mean ± sem plot shows the group means, and a boxplot with significance bars shows the pairwise differences. read the omnibus test first; only interpret the pairwise grid if it is significant. workflows groupcomparison meansem boxplot"},{"id":"workflow-stats-correlation","name":"Workflow — correlation & relationships","family":"Workflows","description":"What moves with what? Correlation computes every pairwise coefficient (auto-choosing Pearson vs Spearman by normality), shown as a heatmap and a pairs plot (scatter + linear fit above the diagonal, distributions on it). Read strength and direction, linear vs monotonic, and watch for multicollinearity — several strongly inter-correlated predictors.","summary":"Which variables move together, and how?","group":"General statistics","url":"sessions/demos/demo-workflow-stats-correlation.json","kind":"workflow","showcases":["Correlation","correlationheatmap","pairsplot"],"keywords":"workflow — correlation & relationships what moves with what? correlation computes every pairwise coefficient (auto-choosing pearson vs spearman by normality), shown as a heatmap and a pairs plot (scatter + linear fit above the diagonal, distributions on it). read strength and direction, linear vs monotonic, and watch for multicollinearity — several strongly inter-correlated predictors. workflows correlation correlationheatmap pairsplot"},{"id":"workflow-stats-regression","name":"Workflow — linear regression + residual diagnostics","family":"Workflows","description":"Predict Y from X, then check the model is honest. Fit Trend Curves fits the line (slope, intercept, R²), the fitted line is overlaid on the data, and the residuals are plotted against X and screened for normality. The lesson: R² alone is not enough — structure in the residuals (a funnel or a curve) means the model is mis-specified even when R² looks high.","summary":"Predict Y from X, then check the model is honest.","group":"General statistics","url":"sessions/demos/demo-workflow-stats-regression.json","kind":"workflow","showcases":["TrendFit","NormalityTest","scatterplot"],"keywords":"workflow — linear regression + residual diagnostics predict y from x, then check the model is honest. fit trend curves fits the line (slope, intercept, r²), the fitted line is overlaid on the data, and the residuals are plotted against x and screened for normality. the lesson: r² alone is not enough — structure in the residuals (a funnel or a curve) means the model is mis-specified even when r² looks high. workflows trendfit normalitytest scatterplot"},{"id":"workflow-stats-logistic","name":"Workflow — logistic regression (binary outcome)","family":"Workflows","description":"Model a yes/no outcome from predictors. Logistic regression reports each predictor’s odds ratio with a 95% CI and a Wald p-value, plus McFadden pseudo-R² and a likelihood-ratio test. The fit plot shows the predicted probability against the linear predictor (the S-curve, for any number of predictors) with the observed outcomes overlaid. Watch for a non-convergence warning — it usually means separation.","summary":"Model a yes/no outcome and read the odds ratios.","group":"General statistics","url":"sessions/demos/demo-workflow-stats-logistic.json","kind":"workflow","showcases":["LogisticRegression","scatterplot"],"keywords":"workflow — logistic regression (binary outcome) model a yes/no outcome from predictors. logistic regression reports each predictor’s odds ratio with a 95% ci and a wald p-value, plus mcfadden pseudo-r² and a likelihood-ratio test. the fit plot shows the predicted probability against the linear predictor (the s-curve, for any number of predictors) with the observed outcomes overlaid. watch for a non-convergence warning — it usually means separation. workflows logisticregression scatterplot"},{"id":"workflow-stats-chi-square","name":"Workflow — categorical association (chi-square)","family":"Workflows","description":"Are two categorical variables related? The chi-squared test of independence cross-tabulates them into a contingency table and tests whether the row and column variables are associated (Yates’ correction on 2×2 tables). Read the statistic / df / p and the table; the node warns when any expected count falls below 5, where the χ² approximation breaks down and Fisher’s exact test is preferable.","summary":"Are two categorical variables related?","group":"General statistics","url":"sessions/demos/demo-workflow-stats-chi-square.json","kind":"workflow","showcases":["ChiSquared"],"keywords":"workflow — categorical association (chi-square) are two categorical variables related? the chi-squared test of independence cross-tabulates them into a contingency table and tests whether the row and column variables are associated (yates’ correction on 2×2 tables). read the statistic / df / p and the table; the node warns when any expected count falls below 5, where the χ² approximation breaks down and fisher’s exact test is preferable. workflows chisquared"},{"id":"workflow-non24-blind","name":"Workflow — non-24 sleep-wake (blind participant)","family":"Workflows","description":"The human counterpart to the free-running mouse. With no light reaching the clock, the rhythm runs at its own tau (here 24.5 h) and drifts steadily later, so the sleep window migrates all the way around the clock over about seven weeks. A double-plotted actogram shows the drift and a Lomb-Scargle periodogram recovers tau. The point is that free-running is not a rodent-only phenomenon: this is a recognised clinical presentation.","summary":"A human rhythm free-running through the day over weeks.","group":"Rhythm & circadian","url":"sessions/demos/demo-workflow-non24-blind.json","kind":"workflow","showcases":["RhythmicityAnalysis","actogram","periodogram"],"keywords":"workflow — non-24 sleep-wake (blind participant) the human counterpart to the free-running mouse. with no light reaching the clock, the rhythm runs at its own tau (here 24.5 h) and drifts steadily later, so the sleep window migrates all the way around the clock over about seven weeks. a double-plotted actogram shows the drift and a lomb-scargle periodogram recovers tau. the point is that free-running is not a rodent-only phenomenon: this is a recognised clinical presentation. workflows rhythmicityanalysis actogram periodogram"},{"id":"workflow-arrhythmic","name":"Workflow — arrhythmic record (negative control)","family":"Workflows","description":"The single most useful thing to see before over-interpreting your own data. An intact record and an arrhythmic one (as after SCN ablation) are analysed side by side with identical settings. The intact periodogram has an unmistakable peak at 24 h; the arrhythmic one still reports a \\"peak period\\", because a periodogram always returns its largest value, but the power is a fraction of the intact case and the actogram shows no band at all. Read the power and the picture, not just the number.","summary":"The negative control: what no rhythm actually looks like.","group":"Reading the output","url":"sessions/demos/demo-workflow-arrhythmic.json","kind":"workflow","showcases":["RhythmicityAnalysis","actogram","periodogram"],"keywords":"workflow — arrhythmic record (negative control) the single most useful thing to see before over-interpreting your own data. an intact record and an arrhythmic one (as after scn ablation) are analysed side by side with identical settings. the intact periodogram has an unmistakable peak at 24 h; the arrhythmic one still reports a \\"peak period\\", because a periodogram always returns its largest value, but the power is a fraction of the intact case and the actogram shows no band at all. read the power and the picture, not just the number. workflows rhythmicityanalysis actogram periodogram"},{"id":"workflow-circatidal","name":"Workflow — circatidal rhythm (12.4 h)","family":"Workflows","description":"Rhythm analysis is not circadian-only. A coastal invertebrate timed to the tides runs at 12.4 h, with a weaker 24.8 h component as successive tides differ. The periodogram search window is the thing to notice: the default 20-28 h window would find the 24.8 h component and miss the dominant tidal peak entirely. Widen the window and both appear.","summary":"A 12.4 h tidal rhythm, not a circadian one.","group":"Rhythm & circadian","url":"sessions/demos/demo-workflow-circatidal.json","kind":"workflow","showcases":["RhythmicityAnalysis","actogram","periodogram"],"keywords":"workflow — circatidal rhythm (12.4 h) rhythm analysis is not circadian-only. a coastal invertebrate timed to the tides runs at 12.4 h, with a weaker 24.8 h component as successive tides differ. the periodogram search window is the thing to notice: the default 20-28 h window would find the 24.8 h component and miss the dominant tidal peak entirely. widen the window and both appear. workflows rhythmicityanalysis actogram periodogram"},{"id":"workflow-reentrainment","name":"Workflow — re-entrainment after a time-zone shift","family":"Workflows","description":"The contrast with an abrupt shift is the lesson. The zeitgeber moves 8 h in one step, but the rhythm does not: it runs at a transient period near 25.3 h for about a week, crawling diagonally across the actogram, before locking on at the new phase. Compare this with a schedule change where the record simply jumps, and the transients are what tell you a real clock is involved rather than direct driving.","summary":"The slow diagonal crawl back into alignment after a time-zone shift.","group":"Rhythm & circadian","url":"sessions/demos/demo-workflow-reentrainment.json","kind":"workflow","showcases":["actogram","periodogram"],"keywords":"workflow — re-entrainment after a time-zone shift the contrast with an abrupt shift is the lesson. the zeitgeber moves 8 h in one step, but the rhythm does not: it runs at a transient period near 25.3 h for about a week, crawling diagonally across the actogram, before locking on at the new phase. compare this with a schedule change where the record simply jumps, and the transients are what tell you a real clock is involved rather than direct driving. workflows actogram periodogram"},{"id":"workflow-transients","name":"Workflow — transients (phase advance vs delay)","family":"Workflows","description":"Two free-running records, each given a single phase-shifting stimulus on the same day, showing the two ways a rhythm can take up a new phase. Both free-run at 24.3 h throughout, so the activity band drifts slowly RIGHTWARD (later) even before anything is done to it — the diagonal that marks a clock running on its own period rather than being held by a zeitgeber. The DELAY is immediate: the band steps right in a single cycle and simply resumes its drift from the new phase, which is what strong (Type 0) resetting looks like. The ADVANCE goes through TRANSIENTS: intermediate cycles between the stimulus and the re-attainment of a steady-state phase, crawling LEFTWARD over about eight cycles. Those cycles do not move at a constant rate — each closes a fraction of whatever phase difference is left, so the increment is largest right after the stimulus and shrinks as the rhythm nears its new phase, giving a curved, decelerating approach rather than a straight ramp. Transients being commoner after advances than delays is the classical generalisation. Only the phase reached AFTER they subside is the steady-state shift, which is why a PRC must be scored from post-transient cycles.","summary":"An immediate delay beside an advance that crawls through transients.","group":"Rhythm & circadian","url":"sessions/demos/demo-workflow-transients.json","kind":"workflow","showcases":["actogram","scatterplot"],"keywords":"workflow — transients (phase advance vs delay) two free-running records, each given a single phase-shifting stimulus on the same day, showing the two ways a rhythm can take up a new phase. both free-run at 24.3 h throughout, so the activity band drifts slowly rightward (later) even before anything is done to it — the diagonal that marks a clock running on its own period rather than being held by a zeitgeber. the delay is immediate: the band steps right in a single cycle and simply resumes its drift from the new phase, which is what strong (type 0) resetting looks like. the advance goes through transients: intermediate cycles between the stimulus and the re-attainment of a steady-state phase, crawling leftward over about eight cycles. those cycles do not move at a constant rate — each closes a fraction of whatever phase difference is left, so the increment is largest right after the stimulus and shrinks as the rhythm nears its new phase, giving a curved, decelerating approach rather than a straight ramp. transients being commoner after advances than delays is the classical generalisation. only the phase reached after they subside is the steady-state shift, which is why a prc must be scored from post-transient cycles. workflows actogram scatterplot"},{"id":"workflow-split-rhythm","name":"Workflow — split rhythm under constant light","family":"Workflows","description":"Under constant light the rhythm can bifurcate: two oscillator components decouple, run at slightly different periods, and re-stabilise roughly 12 h apart. Here the two components are supplied separately (24.8 h and 23.4 h) and their sum is what an actograph would record, so the split is emergent rather than drawn. The periodogram of the sum shows both components, which is the numeric signature of splitting.","summary":"Constant light splits the activity band into two components.","group":"Rhythm & circadian","url":"sessions/demos/demo-workflow-split-rhythm.json","kind":"workflow","showcases":["actogram","periodogram","RhythmicityAnalysis"],"keywords":"workflow — split rhythm under constant light under constant light the rhythm can bifurcate: two oscillator components decouple, run at slightly different periods, and re-stabilise roughly 12 h apart. here the two components are supplied separately (24.8 h and 23.4 h) and their sum is what an actograph would record, so the split is emergent rather than drawn. the periodogram of the sum shows both components, which is the numeric signature of splitting. workflows actogram periodogram rhythmicityanalysis"},{"id":"workflow-noise-peak","name":"Workflow — the multiple-comparison trap","family":"Workflows","description":"A periodogram always returns a largest value, whether or not there is a rhythm. Here twelve records of pure noise are analysed with identical settings. Every one reports a \\"peak period\\", scattered arbitrarily across the search window, and the most impressive of the twelve looks convincing on its own. Test enough series, or enough windows, and something will always look significant. Read this next to the arrhythmic negative control.","summary":"Twelve pure-noise records, and the peak that means nothing.","group":"Reading the output","url":"sessions/demos/demo-workflow-noise-peak.json","kind":"workflow","showcases":["RhythmicityAnalysis","periodogram","DescribeData"],"keywords":"workflow — the multiple-comparison trap a periodogram always returns a largest value, whether or not there is a rhythm. here twelve records of pure noise are analysed with identical settings. every one reports a \\"peak period\\", scattered arbitrarily across the search window, and the most impressive of the twelve looks convincing on its own. test enough series, or enough windows, and something will always look significant. read this next to the arrhythmic negative control. workflows rhythmicityanalysis periodogram describedata"},{"id":"workflow-aliasing","name":"Workflow — sampling rate and aliasing","family":"Workflows","description":"A data-literacy card. The same 24 h rhythm is recorded at 30-minute epochs and then re-sampled every 13 hours. Because 13 h is longer than half the period, the rhythm is below the Nyquist limit for that sampling rate and cannot be recovered: the periodogram of the slow record peaks in the wrong place entirely. Check your epoch length against the period you are hoping to find before you conclude anything is absent.","summary":"Sample too slowly and a 24 h rhythm disappears.","group":"Reading the output","url":"sessions/demos/demo-workflow-aliasing.json","kind":"workflow","showcases":["periodogram","RhythmicityAnalysis"],"keywords":"workflow — sampling rate and aliasing a data-literacy card. the same 24 h rhythm is recorded at 30-minute epochs and then re-sampled every 13 hours. because 13 h is longer than half the period, the rhythm is below the nyquist limit for that sampling rate and cannot be recovered: the periodogram of the slow record peaks in the wrong place entirely. check your epoch length against the period you are hoping to find before you conclude anything is absent. workflows periodogram rhythmicityanalysis"},{"id":"workflow-crepuscular","name":"Workflow — crepuscular (bimodal) activity","family":"Workflows","description":"Many species are crepuscular, with peaks near dawn and dusk rather than one consolidated bout. The periodogram shows this directly: power at 12 h as well as 24 h. It also breaks a common assumption, because a single circular mean phase for a bimodal distribution lands between the two peaks, at the time of day the animal is least active. Look at the distribution before you summarise it with one number.","summary":"Two activity peaks a day, and why one mean phase misleads.","group":"Rhythm & circadian","url":"sessions/demos/demo-workflow-crepuscular.json","kind":"workflow","showcases":["periodogram","actogram","RayleighTest"],"keywords":"workflow — crepuscular (bimodal) activity many species are crepuscular, with peaks near dawn and dusk rather than one consolidated bout. the periodogram shows this directly: power at 12 h as well as 24 h. it also breaks a common assumption, because a single circular mean phase for a bimodal distribution lands between the two peaks, at the time of day the animal is least active. look at the distribution before you summarise it with one number. workflows periodogram actogram rayleightest"},{"id":"workflow-masking","name":"Workflow — masking versus true entrainment","family":"Workflows","description":"Two records that look identical while the light is on, and diverge the moment it goes off. Both animals appear to follow a 6 h shift of the light cycle. Released into constant darkness, the entrained animal keeps the new phase because its clock actually moved, while the masked animal reverts immediately to its original phase because light was only suppressing its behaviour. This is why a shift under a light cycle is not by itself evidence of entrainment: the release is the test.","summary":"Light driving behaviour directly, versus a clock that has shifted.","group":"Rhythm & circadian","url":"sessions/demos/demo-workflow-masking.json","kind":"workflow","showcases":["actogram"],"keywords":"workflow — masking versus true entrainment two records that look identical while the light is on, and diverge the moment it goes off. both animals appear to follow a 6 h shift of the light cycle. released into constant darkness, the entrained animal keeps the new phase because its clock actually moved, while the masked animal reverts immediately to its original phase because light was only suppressing its behaviour. this is why a shift under a light cycle is not by itself evidence of entrainment: the release is the test. workflows actogram"},{"id":"dataset-testdata","name":"Test data","family":"Sources","description":"Data with two simulated rhythms and outliers","group":"Sample data","url":"sessions/demos/testData.csv","kind":"dataset","keywords":"test data data with two simulated rhythms and outliers sources csv url example"},{"id":"dataset-workflow-rest-activity","name":"Actigraphy rest-activity profile","family":"Sources","description":"Characterise a rest-activity record without assuming a sine shape. Data only — 13 columns × 168 rows, no analysis.","summary":"Characterise a rest-activity record without assuming a sine shape.","group":"Rhythm & circadian","url":"sessions/demos/actigraphy-rest-activity-profile.csv","kind":"dataset","showcases":[],"keywords":"actigraphy rest-activity profile characterise a rest-activity record without assuming a sine shape. data only — 13 columns × 168 rows, no analysis. sources"},{"id":"dataset-workflow-free-running","name":"Free-running period","family":"Sources","description":"Measure the endogenous period (tau) of a rhythm with no zeitgeber. Data only — 2 columns × 336 rows, no analysis.","summary":"Measure the endogenous period (tau) of a rhythm with no zeitgeber.","group":"R </strong>, <strong>Rhythm period</strong>, <strong>Rhythm phase shift</strong>, and <strong>Rhythm amplitude</strong>, plus an optional <strong>Noise</strong> term (mode and amplitude). Using multiple sections lets you simulate a free-running rhythm that shifts partway through.</li> <li>Noise is <em>on by default</em>. For a clean pipeline check (below), turn the section's <strong>Noise</strong> off — or set a fixed <strong>Noise seed</strong> at the node level for reproducible noise.</li> <li>The node produces a timestamp column and a values column on its output ports.</li> <li>Add a plot from the palette (e.g. <strong>Periodogram</strong> or <strong>Actogram</strong>) and wire these columns into it — drag from the Simulate Data output port to the plot's input port.</li></ol> <!>",1),iv=H(`<!> <h3 class="section-head">Why Simulate Data?</h3> <p>Simulated data serve several purposes: testing whether an analysis method correctly recovers known parameters; teaching how analytical tools behave; benchmarking new software; and exploring how noise, sampling rate, or missing data affect results.</p> <p>The most useful of these is <strong>validation</strong>. Because you set the parameters yourself, you know the right answer in advance. If you generate a rhythm with a period of exactly 24.0 h and your <a class="gloss" href="#gloss-periodogram">periodogram</a> or <a class="gloss" href="#gloss-cosinor">cosinor</a> fit returns 24.0 h, the pipeline works; if it returns something else, the problem is in your analysis, not your biology. Simulating first is the surest way to trust a new workflow.</p> <h3 class="section-head">The Basic Sinusoidal Model</h3> <p>A simple rhythm is just a repeating wave (a cosine that rises and falls) plus some random noise. Four numbers describe it: the average level, the size of the swing, how fast it repeats, and when it peaks.</p> <!> <p>Here M is the <a class="gloss" href="#gloss-mesor">MESOR</a> (the mid-line the wave oscillates around), A is the <a class="gloss" href="#gloss-amplitude">amplitude</a> (half the peak-to-trough height), τ is the <a class="gloss" href="#gloss-period">period</a> (hours per cycle), φ is the <a class="gloss" href="#gloss-phase">phase</a> offset, and ε(t) ~ N(0, σ²) is random measurement noise. The handbook uses the <strong>cosine convention</strong> throughout (Chapters 1, 7 and 11), so that φ is the <a class="gloss" href="#gloss-acrophase">acrophase</a>: written this way the peak occurs at t = φ·τ/2π. This matches AnCiR's Simulate Data node, which builds a cosine plus noise; note the node takes the phase offset in <strong>hours</strong> (φ<sub>h</sub> = φ·τ/2π), not radians.</p> <p><strong>Worked example.</strong> With M = 100, A = 20, τ = 24 h and φ = 0, and no noise, the signal oscillates smoothly between 80 and 120, completing one full cycle every 24 hours with its peak at t = 0 (a cosine with zero phase starts at its peak). Doubling A to 40 would swing it between 60 and 140; halving τ to 12 h would make it repeat twice as often.</p> <p>Real biological rhythms are rarely perfectly sinusoidal. More realistic simulations may use <strong>truncated sinusoids</strong> (a sine wave with its troughs clipped flat, mimicking an animal that is simply inactive at rest), <strong>Poisson noise</strong> (the natural scatter of count data such as wheel revolutions, where variability grows with the count), or a gradual <strong>period drift</strong> (τ slowly changing, as in a free-running clock).<sup class="cite"><a href="#ref-1">[1]</a></sup></p> <!> <!>`,1);function ov(t){const e=[{year:"1970s–80s",text:"As the field developed increasingly complex analytical tools, simulated data became essential for validation and benchmarking."},{year:"2007",text:'Refinetti, Cornélissen &amp; Halberg provide the most comprehensive framework for simulating chronobiological data, including guidelines on period, amplitude, noise, and waveform shape.<sup class="cite"><a href="#ref-1">[1]</a></sup>'}],a=Strin > <li>Expand the node and pick your <strong>X column</strong> (time) and one or more <strong>Y column(s)</strong>. Multiple Y columns can be binned in one step.</li> <li>Set the <strong>Bin Size</strong> (e.g., 1 h) and <strong>Bin Start</strong> offset.</li> <li>Choose the <strong>Aggregation Function</strong>: <strong>mean</strong> (continuous measurements), <strong>count</strong> (count data such as wheel revolutions), <strong>median</strong>, <strong>min</strong>, <strong>max</strong>, or <strong>stddev</strong>.</li> <li>Tick <strong>Different step size</strong> and set a smaller <strong>Step Size</strong> for a sliding-window (overlapping) average.</li> <li>The node outputs new binned X and Y columns to wire into plots or further processes.</li></ol> <!>",1),wv=H("<ol><li>From the <strong>node palette</strong>, under <strong>Smoothing</strong>, choose <strong>Smooth Data</strong>.</li> <li>Expand the node and select the <strong>X column</strong> (time) and <strong>Y column(s)</strong>. Multiple Y columns can be smoothed in one step.</li> <li>Choose a <strong>Smoother Type</strong> (moving average, LOESS, Savitzky-Golay, or Whittaker-Eilers) and set its parameters. <em>Whittaker-Eilers with Lambda = 100</em> works well for most circadian recordings.</li> <li>The node outputs smoothed X and Y columns.</li> <li>Wire these smoothed columns into your Actogram or Periodogram.</li></ol> <!>",1),bv=H('<ol><li>From the <strong>node palette</strong>, under <strong>Filtering</strong>, choose <strong>Remove Trend</strong>, and wire the column you want to detrend into it.</li> <li>Expand the node and choose the <strong>Trend model</strong>: <strong>linear</strong> is sufficient for most recordings; <strong>polynomial</strong> (with configurable degree), <strong>exponential</strong>, and <strong>logarithmic</strong> are available for more complex drifts.</li> <li>The output column holds the <a class="gloss" href="#gloss-residual">residuals</a> (original − fitted trend). The fitted <a class="gloss" href="#gloss-r-squared">R²</a> and <a class="gloss" href="#gloss-rmse">RMSE</a> are shown in the node.</li> <li>The original data is always preserved — delete the node to restore it.</li></ol> <!>',1),kv=H(`<!> <p class="chapter-intro">Preprocessing — the steps taken before formal analysis — can dramatically affect results. The goal is to improve signal quality without introducing bias. Document every preprocessing decision: choices made here can strongly influence downstream results.</p> <h3 class="section-head">Outlier Removal</h3> <p>Common approaches include threshold-based flagging (values more than k·SD from the mean, typically k = 3) or the more robust median absolute deviation (MAD) method.</p> <!> <p>The mean/SD rule is <strong>not robust</strong>: a few extreme points inflate both the mean and the SD and can hide themselves (masking), which is why the MAD version is preferred. Note also that on a strongly rhythmic series a 3·SD rule flags almost nothing (a pure sinusoid peaks at only 1.41 SD above its mean), while on a smoothed series it can clip real daily peaks. <strong>Apply outlier rules to the residuals after removing the rhythm and trend</strong>, not to the raw trace. Missing data created by outlier removal can propagate through analyses. For spectral methods, methods designed to work with missing data points (e.g., <a class="gloss" href="#gloss-lomb-scargle">Lomb-Scargle</a>) are preferable to simple deletion or interpolation.</p> <!> <h3 class="section-head">Missing Data and Interpolation</h3> <p>Real recordings are rarely complete. Sensors drop out, subjects remove wearables, samples are lost, and removing outliers (above) deliberately leaves holes. These <a class="gloss" href="#gloss-missing-data">gaps</a> matter because many analyses assume an unbroken, regularly spaced series. The <a class="gloss" href="#gloss-fft">FFT</a> and the <a class="gloss" href="#gloss-chi-squared-periodogram">χ² periodogram</a> break down when samples are missing; a moving average over a gap silently averages the wrong span; and even methods that tolerate gaps lose statistical power as more data go missing.</p> <p>There are two broad responses. The first is to <strong>use methods that tolerate gaps</strong> rather than fill them: the <a class="gloss" href="#gloss-lomb-scargle">Lomb-Scargle</a> periodogram<sup class="cite"><a href="#ref-3">[3]</a></sup> and <a class="gloss" href="#gloss-cosinor">cosinor</a> regression both work directly on irregular or incomplete data, without inventing values. This is usually the safest choice.</p> <p>The second is <strong><a class="gloss" href="#gloss-interpolation">interpolation</a></strong>: estimating the missing values from the points around them so downstream tools receive a complete, evenly spaced series. The simplest scheme, <strong>linear</strong> interpolation, just draws a straight line between the two known points that bracket the gap:</p> <!> <p><strong>Nearest-neighbour</strong> interpolation copies the closest known value (useful for categorical or state data), while a <strong>cubic <a class="gloss" href="#gloss-spline">spline</a></strong><sup class="cite"><a href="#ref-22">[22]</a></sup> threads a smooth curve through the points, giving a more natural shape across short gaps.</p> <p>The animation below widens the gap from a few hours to more than a day. For a short gap the straight-line estimate hugs the true rhythm and the error stays tiny; as the gap grows past the rhythm's own period the chord cuts straight across real peaks and troughs, and the largest error (marked in red) balloons. This is why interpolation is safe across small gaps but not large ones.</p> <!> <p><strong>Caution:</strong> interpolation invents data. Across a gap much shorter than the rhythm it is harmless, but filling a gap comparable to or longer than the period fabricates a rhythm that was never observed and biases spectra and amplitude estimates. As a rule, only interpolate across gaps that are short relative to the period of interest<sup class="cite"><a href="#ref-1">[1]</a></sup>; for longer gaps, prefer a gap-tolerant method and report the missing fraction.</p> <!> <h3 class="section-head">Binning</h3> <p>High-resolution data are aggregated into coarser intervals. A bin width of τ/48 to τ/96 (15–30 min for a 24-hour rhythm) is generally appropriate.</p> <!> <p>Bin width is not only a noise/resolution trade-off. It sets the number of bins per cycle, k = τ/w, which in turn sets the <strong>degrees of freedom (k−1) of the <a class="gloss" href="#gloss-chi-squared-periodogram">χ² periodogram</a></strong> and the height of its significance line (Chapter 6) — the same recording binned at 1 h and at 15 min yields different Q_P values and different thresholds. Coarser bins also reduce serial correlation, bringing the data closer to the independence the χ² test assumes. Always report the bin width alongside any periodogram result.</p> <!> <h3 class="section-head">Smoothing</h3> <p>Measurements always carry <strong>noise</strong>: fast, point-to-point jitter from the sensor and the environment that has nothing to do with the underlying biology. <a class="gloss" href="#gloss-smoothing">Smoothing</a> averages each point together with its neighbours so this jitter cancels out and the slower rhythm underneath becomes visible. It is the opposite end of the scale from <a href="#gloss-detrending" class="gloss">detrending</a>: detrending strips away a very slow drift, smoothing strips away very fast noise, and the rhythm you care about sits in between.</p> <p>The simplest smoother, the <strong>moving average</strong>, just replaces each point with the mean of a window of neighbouring points:</p> <!> <p>For example, smoothing <code>[50, 70, 60, 80, 55]</code> with a width-3 window gives the interior values <code>[(50+70+60)/3, (70+60+80)/3, (60+80+55)/3] = [60, 70, 65]</code> &mdash; the spikes are pulled towards their neighbours. A wider window removes more noise but also flattens real peaks, so there is always a trade-off between smoothness and fidelity.</p> <p>AnCiR offers four smoothers, from the crude to the sophisticated:</p> <!> <p><strong>Which to choose?</strong> Use a <strong>moving average</strong> for a quick look; <strong>Savitzky-Golay</strong><sup class="cite"><a href="#ref-19">[19]</a></sup> when peak height and shape matter (hormone pulses, sharp activity onsets); <strong>LOESS</strong><sup class="cite"><a href="#ref-21">[21]</a></sup> for irregularly sampled data; and <strong>Whittaker-Eilers</strong><sup class="cite"><a href="#ref-20">[20]</a></sup> as a robust default that tolerates gaps. For Whittaker-Eilers the key control is <strong>λ</strong>: larger λ gives a smoother curve. Values of 10–1000 span most cases; start around 100 and increase if noise remains or decrease if real structure is being flattened. As a rule of thumb, keep the effective window near 1–2 bin widths so the daily rhythm is preserved.</p> <p><strong>Caution:</strong> smoothing is not free. Over-smoothing suppresses genuine short-period (ultradian) rhythms and reduces the apparent amplitude of the rhythm you are measuring. Always compare the smoothed trace against the raw data before trusting it, and never smooth more than the analysis requires.</p> <!> <h3 class="section-head">Removing Trend (Detrending)</h3> <p>Many biological recordings carry a slow, non-rhythmic <a class="gloss" href="#gloss-detrending">drift</a> on top of the rhythm of interest: an animal steadily gaining weight, a sensor baseline wandering with room temperature, electrode impedance changing over days, or masking by spontaneous activity. This low-frequency component is usually a nuisance rather than the signal you want to characterise.</p> <p>A trend distorts the very analyses that follow. In <a class="gloss" href="#gloss-cosinor">cosinor</a> fitting it biases the estimated <a class="gloss" href="#gloss-mesor">MESOR</a> and can inflate the apparent <a class="gloss" href="#gloss-amplitude">amplitude</a>, because part of the straight-line drift is absorbed into the fitted cosine. In spectral methods (<a class="gloss" href="#gloss-periodogram">periodograms</a> and the <a class="gloss" href="#gloss-fft">FFT</a>) a drift adds strong power at very low frequencies that can leak into the circadian band and produce spurious long-period peaks. Removing the trend first keeps these estimates honest; it is <strong>recommended before cosinor analysis and periodogram computation</strong> whenever a trend is visible.</p> <p>Detrending fits a smooth model of the baseline &mdash; most often a straight line by ordinary least squares &mdash; and subtracts it, leaving the <a class="gloss" href="#gloss-residual">residuals</a>: the rhythm centred on a flat baseline.<sup class="cite"><a href="#ref-1">[1]</a></sup></p> <!> <p>The animation below fits an ordinary-least-squares line through a drifting seven-day recording and reveals the residuals: once the trend is subtracted, the daily rhythm sits on a flat baseline instead of climbing across the record.</p> <!> <p>Match the model to the drift. A <strong>linear</strong> fit handles steady drift and is the safe default; a low-degree <strong>polynomial</strong> follows gentle curvature; <strong>exponential</strong> or <strong>logarithmic</strong> models suit saturating baselines. Resist over-fitting: a high-degree polynomial can soak up genuine low-frequency rhythm along with the drift, flattening real biology. When in doubt, choose the simplest model that visibly removes the baseline, and always inspect the residuals before trusting them.</p> <!> <!>`,1);function xv(t){const e=[{year:"Pre-digital era",text:"Preprocessing was performed manually: researchers visually inspected paper records, hand-marked artefacts, and calculated summary statistics by hand."},{year:"1980s–90s",text:"Digital data enabled automated preprocessing but also introduced new artefacts (recording dropouts, sensor drift)     They display activity data across multiple days in a stacked format that makes
    temporal patterns immediately visible — periodicity, <a class="gloss" href="#gloss-phase-shift">phase shifts</a>, <a class="gloss" href="#gloss-entrainment">entrainment</a>,
    and <a class="gloss" href="#gloss-free-running-period">free-running rhythms</a> all become apparent at a glance.</p> <h3 class="section-head">How an Actogram Works</h3> <p>Time-series data are "folded" into cycles of the assumed period (typically
    24 hours). Each cycle occupies one horizontal row, with time on the x-axis
    and activity on the y-axis. Days are stacked top-to-bottom. Vertical bars
    represent the magnitude of activity at each time point.</p> <h3 class="section-head">Double-Plotting</h3> <p>In a <strong>double-plotted actogram</strong>, each row displays two
    consecutive cycles side by side. This is the <em>standard format in chronobiology</em>. When the endogenous period is not
    exactly 24 hours, activity onsets drift systematically across rows —
    rightward for τ > 24 h, leftward for τ &lt; 24 h — and double-plotting makes
    this drift easy to see by providing visual continuity.</p> <h3 class="section-head">What Actograms Reveal</h3> <ul><li><strong>Periodicity</strong> — whether a rhythm repeats consistently (e.g.
      every ~24 hours).</li> <li><strong>Phase shifts</strong> — changes in the timing of activity onset or
      offset due to jet lag, shifted light-dark cycles, or experimental manipulations.</li> <li><strong>Entrainment</strong> — stable onset times relative to the zeitgeber
      indicate successful synchronisation.</li> <li><strong>Free-running rhythms</strong> — in constant conditions (DD or LL),
      the endogenous period is revealed by systematic onset drift.</li> <li><strong>Arrhythmicity</strong> — absence of rhythmic patterning, seen in clock-mutant
      animals or severe disruption.</li> <li><strong>Masking</strong> — direct effects of the environment on behaviour that
      are not mediated by the clock (light acutely suppressing activity in a nocturnal
      rodent, handling or cage-change spikes, feeding-driven bouts).</li></ul> <!> <h3 class="section-head">Mathematics</h3> <h4 class="sub-head">Data Folding</h4> <p>For timestamps t₁, t₂, …, tₙ and folding period τ, the row number and
    position within row for the i-th data point are:</p> <!> <h4 class="sub-head">Period Estimation from Onset Times</h4> <p>Activity onsets are detected as the first time per cycle that y exceeds a
    threshold:</p> <!> <p>Estimate the period by regressing <strong>absolute onset time</strong> (hours
    since the start of the record, not the within-row position) on cycle number; <strong>the slope is τ̂ directly</strong>. Equivalently, if you regress the
    within-row onset position from an actogram folded at τ<sub>fold</sub>, then
    τ̂ = τ<sub>fold</sub> + slope — note this is the <em>folding</em> period, not
    always 24 h. Because the within-row position wraps at the row boundary, onset
    times must be unwrapped (adding τ<sub>fold</sub> at each wrap) before regression.</p> <p>In practice a single noisy bin will trip a bare first-crossing rule. Standard
    implementations require the signal to <strong>remain above threshold for
    several consecutive bins</strong> and to be preceded by a quiet interval. State
    whether the mean and SD are computed over the whole record or per cycle — on a
    drifting record the two give different onsets — and check onsets that fall close
    to a row boundary by eye.</p> <h3 class="section-head">Worked Example</h3> <p>Simulated rodent locomotor activity: 15-minute resolution over 28 days in
    DD. Days 1–14: τ = 24.5 h (rightward drift); days 15–28: τ = 22.25 h
    (leftward drift). Signal: Activity = 50 + 50 · sin(2πt/τ) + Uniform(0,10)
    noise. The actogram immediately reveals the change at day 14. Automated

r

            sampled activity data; most widely used in chronobiology.</li> <li><strong>Lomb<sup class="cite"><a href="#ref-3">[3]</a></sup>-Scargle<sup class="cite"><a href="#ref-4">[4]</a></sup></strong> — use for data with irregular timing or gaps.</li> <li><strong>Enright</strong> — variance-of-period-folded-means; a robust

    structure by estimating the relative contribution of different periodicities
    to an observed time series. The result is a plot of spectral power (a
    measure of how strongly each period contributes to the signal) against
    period, with significant peaks identifying dominant rhythms.</p> <h3 class="section-head">Chi-Squared Periodogram (Sokolove-Bushell)</h3> <p>The <a class="gloss" href="#gloss-chi-squared-periodogram">chi-squared periodogram</a> is the most widely used method in chronobiology. For each test period P, data
    are folded and the χ² statistic tests whether bin means differ from the
    grand mean:</p> <!> <p>Where N is the number of (binned) data points included, k is the number of
    bins per fold, x̄ⱼ is the mean of bin j, x̄ is the grand mean, and the divisor
    is the <strong>population</strong> <a class="gloss" href="#gloss-variance">variance</a> σ̂² = (1/N)·Σ(xᵢ − x̄)² (divisor N,
    not N−1). The factor N/k must be the <strong>truncated integer</strong> number of <em>complete</em> cycles at that trial period, ⌊N/k⌋; non-integer cycle counts
    are the source of the periodogram's well-documented discontinuity artefact.<sup class="cite"><a href="#ref-23">[23]</a></sup> Q_p is approximately χ²-distributed with (k−1) <a class="gloss" href="#gloss-degrees-of-freedom">degrees of freedom</a> under the <a class="gloss" href="#gloss-null-hypothesis">null hypothesis</a> of no rhythmicity.</p> <!> <h3 class="section-head">Lomb-Scargle Periodogram</h3> <p>Handles irregularly sampled time series by fitting sinusoidal models at each
    test frequency, correcting for unequal spacing via a time-offset parameter.
    Increasingly used in chronobiology for sparse clinical datasets, actigraphy
    with gaps, and hormone time-course data.</p> <p>Lomb-Scargle is not assumption-free. It fits a <strong>single sinusoid</strong> at each frequency, so like <a class="gloss" href="#gloss-cosinor">cosinor</a> it underestimates the amplitude of, and can
    miss, strongly non-sinusoidal (square-wave) rhythms; its noise model is Gaussian
    and homoscedastic, which count data violate (consider a variance-stabilising
    transform); and its standard false-alarm probability assumes independent trial
    frequencies, so it understates the false-positive rate on a fine period grid — a
    permutation-based threshold is safer. Irregular sampling also imposes a spectral
    window whose sidelobes can create spurious peaks, so inspect the sampling pattern
    when it is structured (e.g. daytime-only clinical sampling).</p> <h3 class="section-head">Enright Periodogram</h3> <p>The <a class="gloss" href="#gloss-enright-periodogram">Enright periodogram</a><sup class="cite"><a href="#ref-23">[23]</a></sup> folds the series at each trial
    period into a Buys-Ballot table (rows = cycles, columns = position within the
    cycle) and uses the <strong>standard deviation of the column means</strong> as
    its test statistic: a true period makes the fold means scatter widely. It is the
    direct ancestor of the chi-squared periodogram — Sokolove and Bushell's Q_P is
    essentially Enright's statistic rescaled to a known χ² null distribution.
    Because the two are so closely related, an Enright peak and a chi-squared peak
    at the same period are <strong>not independent confirmation</strong> of each
    other. Enright's method makes no distributional assumption and is robust with
    longer recordings.</p> <h3 class="section-head">Interpreting a Periodogram</h3> <ul><li>A sharp, high-power peak at ~24 h indicates well-entrained circadian
      rhythmicity.</li> <li>In free-running conditions, the peak shifts to the animal's endogenous τ.</li> <li>Multiple peaks may indicate <a class="gloss" href="#gloss-harmonic">harmonic</a> structure (at τ/2, τ/3) or genuine
      multi-frequency rhythmicity.</li> <li>A flat periodogram suggests arrhythmicity, insufficient data, or excessive
      noise.</li></ul> <!> <!> <p>The animation below illustrates a <em>cosinor-style</em> periodogram — it plots
    the variance explained (R²) by a best-fit sinusoid at each trial period, which
    peaks at the true period just as the χ² statistic does. The chi-squared and
    Lomb-Scargle methods above use different statistics but are read the same way.</p> <!> <!> <!>`,1);function Dv(t){const e=[{year:"1965",text:'James Enright introduces a periodogram for detecting rhythmicity in locomotor activity data, based on the variance of period-folded data<sup class="cite"><a href="#ref-23">[23]</a></sup> — the direct ancestor of the chi-squared periodogram formalised by Sokolove and Bushell in 1978 (below).'},{year:"1976–1982",text:'Building on earlier least-squares spectral methods, Nicholas Lomb<sup class="cite"><a href="#ref-3">[3]</a></sup> (1976) develops a periodogram for unequally spaced data; Jeffrey Scargle<sup class="cite"><a href="#ref-4">[4]</a></sup> (1982) establishes its statistical behaviour and false-alarm probabilities, giving the modern Lomb-Scargle periodogram.'},{year:"1978",text:'Philip Sokolove<sup class="cite"><a href="#ref-2">[2]</a></sup> and Wayne Bushell refine and popularise the chi-square periodogram with a clear mathematical framework still used today (J. Theor. Biol. 72:131–160).'}],a=String.raw`Q_P = \frac{N}{k} \cdot \frac{\displaystyle\sum_j (\bar{x}_j - \bar{x})^2}{s^2}`;At(t,{id:"ch6",num:"Chapter 6",title:"Periodograms",children:(r,s)=>{var n=Ev(),i=je(n);Ea(i,{get entries(){return e}});var o=k(i,8);Ot(o,{get tex(){return a}});var l=k(o,4);Br(l,{title:"Important Limitation",children:(y,x)=>{var w=zv();B(y,w)},$$slots:{default:!0}});var d=k(l,16);Br(d,{title:"Harmonic Artefact",children:(y,x)=>{var w=qv();B(y,w)},$$slots:{default:!0}});var u=k(d,2);Br(u,{title:"The significance line and multiple testing",children:(y,x)=>{var w=Fv();B(y,w)},$$slots:{default:!0}});var m=k(u,4);Pv(m,{height:"600px"});var g=k(m,2);Tt(g,{title:"Running a Periodogram in AnCiR",tip:"Note the estimated period for use in the next step — Cosinor analysis performs better when you use the measured τ rather than assuming exactly 24 h.",children:(y,x)=>{var w=Iv(),A=k(je(w),2);Et(A,{session:"sessions/demos/demo-periodogram-rhythm.json",label:"Open the Periodogram example in AnCiR"}),B(y,w)},$$slots:{default:!0}});var f=k(g,2);ga(f,{chapter:"ch6"}),B(r,n)},$$slots:{default:!0}})}var Nv=H("<p>AnCiR does not yet implement the population-mean cosinor as a single test: wiring several <strong>Y columns</strong> (one per subject) into a <strong>Cosinor</strong> node fits each subject <em>independently</em> and returns a per-subject results table. To obtain a group-level estimate, export that table (via a <strong>tableplot</strong> or <strong>Save session</strong>) and vector-average the individual (β, γ) estimates in R (<em>cosinor2</em>) or Python, or plot the individual acrophases on the <strong>Circular phase plot</strong> and test them with the <strong>Rayleigh test</strong> node (Chapter 12).</p>"),Lv=H('<ol><li>Open the <strong>node palette</strong> (the <strong>+</strong> button, top-right) and, under <strong>Fitting</strong>, choose <strong>Cosinor</strong>.</li> <li>Expand the node and choose your <strong>X column</strong> (time) and one or more <strong>Y columns</strong>. Multiple Y columns are fitted independently in one step.</li> <li>Choose the mode: <ul><li><strong>Use Fixed Period (Halberg cosinor):</strong> enter the <strong>Period (hrs)</strong> (use 24 h, or your estimated τ from the periodogram) and the number of <strong>harmonics</strong> (<a class="gloss" href="#gloss-harmonic">harmonics</a>; start with 1). Choose the <strong>CI level</strong> (the dropdown offers 95% / 99%). This gives MESOR, amplitude, acrophase ± CI, and an F-test <a class="gloss" href="#gloss-p-value">p-value</a>. AnCiR can also run an optional <strong>permutation test</strong> for a distribution-free p-value.</li> <li><strong>Free period:</strong> leave Fixed Period unticked and set <strong>N cosine curves</strong> = 1 to fit a single sinusoid with optimised period and phase. N &gt; 1 fits multiple overlapping cosines.</li></ul></li> <li>Optionally enable an <strong>Output X column</strong> (a regularly spaced Sequence Column) to evaluate the fitted curve at fine intervals for a smooth overlay.</li> <li>The node outputs fitted columns plus a results table; read off <strong>MESOR</strong>, <strong>amplitude</strong>, <strong>acrophase</strong>, <strong>R²</strong>, and <strong>p-value</strong>.</li> <li><strong>Overlay the fit:</strong> add a <strong>scatterplot</strong> from the palette, wire the raw data as one series (points) and the fitted columns as a second series (line).</li> <li>Click <strong>Store Value</strong> next to any scalar (e.g., period, amplitude) to save it as a <strong>Stored Value</strong> for use in Formula Columns or elsewhere.</li></ol> <!>',1),Bv=H(`<ul><li><strong>Harmonic cosinor</strong> — set <strong>harmonics</strong> &gt; 1 on the <strong>Cosinor</strong> node to bend the sinusoid toward the true shape while keeping cosinor's interpretable parameters.</li> <li><strong>Rectangular Wave</strong> (Fitting) — a smooth on/off square wave (a hyperbolic-tangent, <code>tanh</code>, approximation) for near-binary active/rest rhythms. Its <strong>duty cycle</strong> parameter reports the fraction of each cycle spent active; a sharpness parameter controls how square the corners are.</li> <li><strong>Double-Logistic</strong> (Fitting) — two back-to-back sigmoids modelling a smooth rise to a plateau and a return, giving <em>separate</em> transition times and steepnesses for the onset and the offset. Standard in land-surface phenology, and a good fit when circadian on/off transitions are gradual and possibly asymmetric.</li> <li><strong>FitFunction</strong> (Fitting) — the umbrella node: switch between cosinor, rectangular-wave and double-logistic on the same series without rewiring, with a common set of controls.</li></ul> <p>Match the model to the biology: cosinor for smooth, near-sinusoidal rhythms; rectangular wave for crisp on/off patterns; double-logistic when onset and offset are gradual. For a summary that assumes <em>no</em> functional form at all, use the nonparametric rest-activity measures or the average-day profile (<a href="#ch9">Chapter 9</a>).</p>`,1),Ov=H(`<!> <p class="chapter-intro"><a class="gloss" href="#gloss-cosinor">Cosinor</a> analysis is a regression-based method for characterising rhythms. Unlike periodograms, which detect <em>whether</em> a rhythm exists, cosinor analysis <strong>estimates rhythm parameters</strong> — <a class="gloss" href="#gloss-mesor">MESOR</a>, <a class="gloss" href="#gloss-amplitude">amplitude</a>, and <a class="gloss" href="#gloss-acrophase">acrophase</a> — with <a class="gloss" href="#gloss-confidence-interval">confidence intervals</a>, enabling formal comparison between groups or conditions.</p> <h3 class="section-head">The Cosinor Model</h3> <p>A rhythm is modelled as a cosine function fitted by linear regression. By substituting β = A·cos(φ) and γ = −A·sin(φ):</p> <!> <p>This is linear in β and γ and is fitted by ordinary least squares. The rhythm parameters are recovered as:</p> <!> <p>The <strong>two-argument</strong> arctangent (<code>atan2</code>) is essential — plain <code>arctan</code> cannot separate φ from φ + π and would place the <a class="gloss" href="#gloss-acrophase">acrophase</a> at the trough for half of all datasets. Convert to clock time as t<sub>peak</sub> = φ·τ/2π (mod τ). The classical cosinor convention instead reports acrophase in <strong>negative degrees</strong> from a stated reference time (0°), with 360° = one period; whichever you use, <strong>always state the reference time</strong>, and note that when τ ≠ 24 h the acrophase drifts in clock time across the record.</p> <!> <h3 class="section-head">Fixed-Period vs. Free-Parameter Mode</h3> <p>When the period is known (e.g., studying a circadian rhythm in LD conditions), <strong>fixed-period (Halberg) cosinor</strong> is preferred — it gives more robust parameter estimates with confidence intervals and an <a class="gloss" href="#gloss-f-test">F-test</a> for rhythm significance. When the period is unknown, <strong>free-parameter</strong> mode fits the period alongside amplitude and phase.</p> <p>For fixed τ the model is linear in (M, β, γ) and the test of rhythmicity is the joint hypothesis H₀: β = γ = 0, an F-test with <strong>2 and N − 3 degrees of freedom</strong>. This assumes <strong>independent residuals</strong>. Circadian recordings are strongly autocorrelated, so p-values are optimistic and confidence intervals too narrow unless the data are binned coarsely enough to decorrelate, or an autocorrelation-aware model is used (Chapter 11). In free-period mode τ is estimated too, the model is <em>no longer linear</em>, and OLS/F-test theory does not apply — intervals are asymptotic approximations at best.</p> <h3 class="section-head">Population-Mean Cosinor</h3> <p>When multiple subjects have been recorded, the <a class="gloss" href="#gloss-population-cosinor">population-mean cosinor</a><sup class="cite"><a href="#ref-6">[6]</a></sup> estimates group-level rhythm parameters by vector-averaging individual (β, γ) estimates, tested using the modified F-test (Nelson et al.<sup class="cite"><a href="#ref-7">[7]</a></sup>; Bingham et al.<sup class="cite"><a href="#ref-8">[8]</a></sup>).</p> <!> <!> <h3 class="section-head">Beyond the Cosine: Non-Sinusoidal Fits</h3> <p>A cosine is the right model only when the waveform is roughly sinusoidal. Many activity rhythms are not: they switch sharply between active and rest, or rise and fall on different timescales. A single cosine then <strong>underestimates the amplitude</strong> and can misplace the peak. AnCiR's <strong>Fitting</strong> family offers shape-matched alternatives, all fitted by nonlinear least squares and sharing the same permutation significance test, so you can compare their fits on the same series.</p> <!> <!>`,1);function Wv(t){const e=[{year:"1950s–60s",text:'Franz Halberg (University of Minnesota) develops cosinor analysis as a principled way to estimate rhythm parameters from clinical duces a smoother, more

      resolution</strong> — the true resolution is still set by the record length
      (see below), and no amount of padding separates two periods the record cannot

      evenly spaced data and decomposes the signal into a sum of sinusoids, while
      periodograms (like Lomb-Scargle) can handle uneven sampling and use different
      statistical approaches to assess rhythmicity.</p>`),Vv=H(`<ol><li>Open the <strong>node palette</strong> (the <strong>+</strong> button, top-right)

        uniformly sampled (use <strong>Bin Data</strong> first if needed).</li> <li>The magnitude spectrum (√power) is plotted against period in hours.
        Peaks correspond to dominant oscillatory components.</li> <li>Hover over a peak to read off its period. The primary peak is
        highlighted automatically.</li> <li>Note: for irregularly sampled or gappy data, use the <strong>Lomb <sup class="cite"><a href="#ref-3">[3]</a></sup>-Scargle <sup class="cite"><a href="#ref-4">[4]</a></sup> Periodogram</strong> instead.</li></ol> <!>`,1),Yv=H(`<!> <h3 class="section-head">Core Concept</h3> <p>The <a class="gloss" href="#gloss-dft">Discrete Fourier Transform (DFT)</a> decomposes a time series into
    constituent frequency components. For N discretely sampled points with
    sampling interval Δt:</p> <!> <p>Each component sits at frequency fⱼ = j/(NΔt). The <a class="gloss" href="#gloss-power-spectrum">power spectrum</a> |Fⱼ|²
    (or, as AnCiR plots it, the magnitude √|Fⱼ|²) against period 1/fⱼ reveals
    dominant rhythmic components. AnCiR uses the Cooley-Tukey <a class="gloss" href="#gloss-fft">FFT</a> algorithm and <a class="gloss" href="#gloss-zero-padding">zero-pads</a> the series to the next power of 2, and removes the mean and
    trend before transforming.</p> <!> <h3 class="section-head">Windowing</h3> <p>When the true rhythm period is not a precise multiple of the record length,
    spectral power "leaks" to adjacent frequencies. <a class="gloss" href="#gloss-window-function">Windowing functions</a> (Hann,
    Hamming, Blackman) reduce <a class="gloss" href="#gloss-spectral-leakage">spectral leakage</a> (where power from one frequency
    'bleeds' into neighbouring frequencies) at the cost of some frequency
    resolution. AnCiR's FFT does not currently expose a choice of window; removing
    the mean and trend first (which it does automatically) is the most important
    step for limiting leakage in practice.</p> <h3 class="section-head">Important Limitation</h3> <!> <h3 class="section-head">Frequency Resolution — a Major Practical Limit</h3> <p>Fourier frequency resolution is Δf = 1/T, where T is the total record length.
    Converted to <em>period</em> — which is how chronobiological spectra are read —
    the resolution near a period τ is <strong>Δτ ≈ τ²/T</strong>, and this is far
    coarser than most users expect. For a <strong>10-day record (T = 240 h),
    Δτ ≈ 24²/240 = 2.4 h at the circadian peak</strong>: the neighbouring FFT bins
    fall near 21.8 h and 26.7 h, so a raw FFT of 10 days <strong>cannot separate a
    23.5 h rhythm from a 24.5 h one</strong>. Resolving τ to ±0.5 h at 24 h needs
    T ≈ 24²/0.5 ≈ 1150 h, about 48 days. This is why the FFT is a good <em>screening</em> tool but a poor <em>period estimator</em> for circadian work;

        average-day profile.</li></ol>`),e2=H(`<!> <p class="chapter-intro">The <a class="gloss" href="#gloss-autocorrelation">autocorrelation</a> function (ACF) measures the correlation of a time series
    with a time-lagged version of itself. A <a class="gloss" href="#gloss-correlogram">correlogram</a> (ACF vs. lag) detects
    rhythmicity and estimates period without the distributional assumptions of
    spectral methods.</p> <h3 class="section-head">The Autocorrelation Function</h3> <!> <p>For a 24-hour rhythm, significant positive peaks are expected at lags of
    approximately 24, 48, and 72 hours. This is the standard <strong>biased</strong> estimator: because the numerator has only N − k terms while the denominator has
    N, r(k) is automatically shrunk by roughly (N − k)/N. Peak heights therefore
    decline with lag <em>even for a perfect, noiseless rhythm</em>, and only the
    excess decline reflects genuine loss of rhythm stability. Under the null of
    white noise, r(k) has approximate 95% bounds of <strong>±1.96/√N</strong>,
    conventionally drawn on the correlogram; peaks outside them are taken as
    significant.</p> <p>The ACF assumes a <strong>stationary, evenly spaced</strong> series and requires
    the data to be <a class="gloss" href="#gloss-detrending">detrended</a> first — an undetrended drift produces a slowly
    decaying, uniformly positive ACF that buries the rhythmic peaks. It is also
    unreliable if the period or amplitude changes during the record; segment the
    record and analyse each part separately.</p> <h3 class="section-head">Period Estimation</h3> <!> <p>This approach is robust to moderate noise. If no clear peak appears within
    the circadian range, this suggests arrhythmicity or signal-to-noise too low
    for reliable detection.</p> <!> <!> <h3 class="section-head">Non-Parametric Rest-Activity Metrics</h3> <p>Not every rhythm is a smooth sine wave. Rest-activity records in particular
    switch sharply between rest and activity, so <a class="gloss" href="#gloss-cosinor">cosinor</a> and spectral measures of <a class="gloss" href="#gloss-amplitude">amplitude</a> can be
    misleading. <a class="gloss" href="#gloss-npcra">NPCRA</a> metrics instead summarise the
    rhythm directly from the data, without assuming a sinusoidal shape, by folding
    activity onto an average 24-hour profile<sup class="cite"><a href="#ref-10">[10]</a><a href="#ref-11">[11]</a><a href="#ref-18">[18]</a></sup>. <a class="gloss" href="#gloss-is">IS</a> and <a class="gloss" href="#gloss-iv">IV</a> capture day-to-day regularity and within-day fragmentation, while M10, L5, and
    Relative Amplitude (RA) describe the height and contrast of the active and rest
    phases. They are especially useful in clinical populations (older adults, ICU
    patients, dementia) where traditional period estimation may be unreliable due to
    irregular activity patterns.</p> <!> <p>All four metrics are computed on the <strong>binned</strong> record and are
    strongly <strong>epoch-dependent</strong> — IS and IV computed at 1-minute and
    1-hour epochs are not comparable, so always report the epoch. IS is biased upward

    chapter to Chapter 6. Finally, all of these describe <em>observed behaviour, not

    (Analysis family) for the correlation between two series at each lag — useful for
